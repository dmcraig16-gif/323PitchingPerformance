<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCA Sports Way Coach Guide</title>
<meta name="description" content="Practice planner, drill library and game-day tools from the FCA Sports Idaho Clubs coach guide.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FCA Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6E6E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242422" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Montserrat:wght@500;800&display=swap">
<style>
/* Layout: one column "clipboard" — sticky wordmark header, section tabs (bottom bar on phones),
   practice plans read as a clock-time timeline like the printed templates. */
:root {
  --bg: #F4F4F1;
  --surface: #FFFFFF;
  --ink: #151515;
  --muted: #5D5C56;
  --line: #E0DFD8;
  --gold: #FFC20E;
  --on-gold: #151515;
  --gold-soft: #FFF2C2;
  --gold-text: #8A6300;
  --good: #1D7547;
  --bad: #B3261E;
  --band: #E6E6E6;
  --field: #DDE8D6;
  --dirt: #EBDDC9;
  --dirt-dark: #D9C6AA;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-label: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --radius: 10px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --surface: #1C1C1A; --ink: #F1F0EA; --muted: #A4A399; --line: #302F2B;
    --gold-soft: #3A3011; --gold-text: #FFC20E; --good: #61C58F; --bad: #F2877E; --band: #242422; --field: #26301F; --dirt: #3A3127; --dirt-dark: #4A3E30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --surface: #1C1C1A; --ink: #F1F0EA; --muted: #A4A399; --line: #302F2B;
  --gold-soft: #3A3011; --gold-text: #FFC20E; --good: #61C58F; --bad: #F2877E; --band: #242422; --field: #26301F; --dirt: #3A3127; --dirt-dark: #4A3E30;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--font-body);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--band); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge { width: 44px; height: 44px; flex: none; }
.mark { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
.mark b { font-weight: 800; }
.mark span { font-weight: 500; }
.mark-sub { font-family: var(--font-label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab {
  border: 0; background: none; padding: 8px 12px; border-radius: 999px;
  font-family: var(--font-label); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
}
.tab[aria-current="page"] { background: var(--gold); color: var(--on-gold); }
.tab svg { display: none; }
@media (max-width: 720px) {
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; padding: 6px 10px; border-radius: 12px; flex: 1; }
  .tab svg { display: block; width: 22px; height: 22px; }
}

main { max-width: 880px; margin: 0 auto; padding: 20px 16px 0; display: grid; gap: 20px; }
.view-head { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px; color: var(--gold-text); }
h1.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.1; letter-spacing: -0.02em; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
h2.sec { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
h3.sub { font-family: var(--font-label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 15px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel > *, .res > *, main > * { min-width: 0; }
.table-wrap { max-width: 100%; position: relative; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; flex: 1 1 140px; min-width: 0; }
.field > span { font-family: var(--font-label); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; font-size: 16px;
}
textarea { resize: vertical; min-height: 80px; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px;
  font-family: var(--font-label); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.check-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
.check-inline input { width: 18px; height: 18px; accent-color: var(--gold); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-family: var(--font-label); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; font-weight: 500;
}
.chip button { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 16px; line-height: 1; }
.chip .open { padding: 0; font-weight: 500; color: var(--ink); font-size: 14px; text-align: left; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
.filter[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }

/* Practice timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.blk { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.blk:first-child { border-top: 0; }
.clock { font-family: var(--font-label); font-variant-numeric: tabular-nums; line-height: 1.15; padding-top: 6px; }
.clock b { display: block; font-size: 20px; font-weight: 700; }
.clock span { font-size: 14px; color: var(--muted); font-weight: 600; }
.blk-main { display: grid; gap: 8px; min-width: 0; }
.blk-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.blk-title { flex: 1 1 180px; font-weight: 600; }
.mins { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.mins button { border: 0; background: none; width: 34px; height: 38px; font-size: 18px; color: var(--muted); }
.mins input { width: 46px; border: 0; border-radius: 0; text-align: center; padding: 8px 0; background: none; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.mins input::-webkit-outer-spin-button, .mins input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.mins small { padding-right: 6px; color: var(--muted); font-size: 13px; }
.blk-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.blk.end .clock b { color: var(--gold-text); }
.blk.prayer .blk-title { font-style: italic; }
.summary { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-family: var(--font-label); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.summary b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
.templates { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tpl { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius); padding: 12px; display: grid; gap: 2px; }
.tpl b { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.tpl span { color: var(--muted); font-size: 14px; }
.tpl:hover { border-color: var(--gold); }
.callout { background: var(--gold-soft); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; }

/* Drill library */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0;
}
.card:hover { border-color: var(--gold); }
.card h3 { font-family: var(--font-body); font-weight: 600; font-size: 17px; line-height: 1.25; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--font-label); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tag { color: var(--gold-text); }
.kind { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* Content (drill bodies, signs, goals) */
.prose { display: grid; gap: 12px; min-width: 0; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.prose li.subli { list-style: circle; margin-left: 18px; color: var(--muted); }
.prose p { margin: 0; }
.prose h4 { margin: 4px 0 0; font-family: var(--font-label); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; }
.focus { border-left: 4px solid var(--gold); padding: 4px 0 4px 12px; font-weight: 500; }
.signs { width: 100%; border-collapse: collapse; font-size: 15px; }
.signs th, .signs td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.signs th { width: 56px; font-family: var(--font-label); font-size: 20px; font-variant-numeric: tabular-nums; color: var(--gold-text); }
.table-wrap { overflow-x: auto; }
.acronym { display: grid; gap: 10px; }
.acronym div { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.acronym b { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; background: var(--gold); color: var(--on-gold); border-radius: 6px; text-align: center; padding: 6px 0; }
.acronym strong { display: block; }
.acronym span { color: var(--muted); font-size: 15px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

/* Game day */
.lineup { width: 100%; border-collapse: collapse; }
.lineup td { padding: 4px 4px; border-top: 1px solid var(--line); }
.lineup td:first-child { width: 32px; font-family: var(--font-label); font-weight: 700; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.lineup td:last-child { width: 84px; }
.lineup input { padding: 7px 8px; }
.pregame { list-style: none; margin: 0; padding: 0; display: grid; }
.pregame li { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.pregame li:first-child { border-top: 0; }
.pregame strong { display: block; }
.pregame span { color: var(--muted); font-size: 14px; }

.counter { display: flex; align-items: center; gap: 10px; }
.counter button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; }
.counter button.plus { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.big { font-family: var(--font-label); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.freebies { width: 100%; border-collapse: collapse; }
.freebies th, .freebies td { padding: 6px 4px; border-top: 1px solid var(--line); text-align: center; }
.freebies th:first-child, .freebies td:first-child { text-align: left; }
.freebies thead th { border-top: 0; font-family: var(--font-label); text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: var(--muted); }
.tap { display: inline-flex; align-items: center; gap: 6px; }
.tap button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.tap b { font-family: var(--font-label); font-size: 22px; min-width: 2ch; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-family: var(--font-label); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
.pill.good { background: var(--good); color: var(--surface); }
.pill.bad { background: var(--bad); color: var(--surface); }
.pill.even { background: var(--line); color: var(--ink); }
.arm { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.arm:first-of-type { border-top: 0; }
.arm-stats { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--font-label); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.05em; color: var(--muted); }
.arm-stats b { display: block; font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.arm-stats .warn b { color: var(--bad); }
.arm-stats .ok b { color: var(--good); }

/* Lineup card */
.roster { width: 100%; border-collapse: collapse; }
.roster th { text-align: left; font-family: var(--font-label); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: var(--muted); padding: 0 4px 4px; }
.roster td { padding: 3px 4px; }
.roster td:first-child { width: 64px; }
.roster td:nth-child(3) { width: 34%; }
.roster td:last-child { width: 40px; }
.roster input { padding: 7px 8px; }
.lcard { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; border: 2px solid var(--ink); }
.lcard th { background: var(--ink); color: var(--surface); font-family: var(--font-label); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 4px; text-align: center; }
.lcard th:nth-child(2) { text-align: left; }
.lcard td { border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 3px; text-align: center; }
.lcard td.ord { font-family: var(--font-label); font-weight: 700; font-size: 18px; width: 34px; }
.lcard td.nm { text-align: left; font-weight: 600; white-space: nowrap; padding: 3px 8px; min-width: 130px; }
.lcard select { width: 54px; padding: 5px 2px; font-family: var(--font-label); font-weight: 700; font-size: 16px; text-align: center; border-radius: 6px; }
.lcard select.bn { color: var(--muted); font-weight: 600; }
.lcard select.clash { border-color: var(--bad); color: var(--bad); }
.lcard tfoot td { font-family: var(--font-label); font-weight: 700; }
.lcard .warnc { color: var(--bad); }
.lcard .okc { color: var(--good); }
.card-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.boxes { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.boxes span { display: inline-flex; align-items: center; gap: 6px; }
.boxes i { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 2px; }

/* Devo template */
.devo-flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
.devo-flow > li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; counter-increment: step; }
.devo-flow > li::before { content: counter(step); font-family: var(--font-display); font-weight: 800; font-size: 15px; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; margin-top: 18px; }
.devo-flow .field { gap: 6px; }

/* Resources */
.res-nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 10; background: var(--bg); padding: 10px 0 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.res-nav::-webkit-scrollbar { display: none; }
.res-nav .filter { flex: none; }
.res { display: grid; gap: 14px; scroll-margin-top: 130px; min-width: 0; }
.res-h { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; text-transform: uppercase; padding-top: 12px; border-top: 3px solid var(--ink); }
.res .row .res-h { flex: 1; }
.mission { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.mission .eyebrow, .mission .lede { color: var(--on-gold); }
.mission p:not(.lede) { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(17px, 3.6vw, 21px); line-height: 1.4; max-width: 60ch; }
.mission b { font-weight: 800; }
.bunt-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 640px) { .bunt-grid { grid-template-columns: minmax(0, 1fr); } }
.field { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
.f-grass { fill: var(--field); }
.f-infield { fill: var(--dirt); }
.f-line { stroke: var(--surface); stroke-width: 1.5; }
.f-mound { fill: var(--dirt-dark); }
.f-base { fill: var(--surface); stroke: var(--ink); stroke-width: 0.75; }
.f-move { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.f-arrowhead { fill: var(--ink); }
.f-start { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
.f-player circle { fill: var(--gold); stroke: var(--ink); stroke-width: 1.5; }
.f-player text { font-family: var(--font-label); font-weight: 700; font-size: 10px; text-anchor: middle; fill: var(--on-gold); }
.f-player.idle circle { fill: var(--surface); }
.f-player.idle text { fill: var(--muted); }
.assign th { width: 48px; font-size: 16px; }

/* Team */
.mandate { display: grid; gap: 10px; counter-reset: m; list-style: none; margin: 0; padding: 0; }
.mandate li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.mandate li b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; color: var(--gold-text); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--gold); flex: none; }
.check small { display: block; color: var(--muted); font-size: 14px; }
.check.done span { text-decoration: line-through; color: var(--muted); }

/* Dialog */
dialog {
  border: 0; padding: 0; border-radius: 14px; background: var(--surface); color: var(--ink);
  width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 48px); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

/* ========================== helpers ========================== */
function toMin(hhmm) { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function clock(total) {
  total = ((total % 1440) + 1440) % 1440;
  const h = Math.floor(total / 60), m = total % 60;
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
}
const clockShort = t => clock(t).replace(/ (AM|PM)$/, '');
const offset = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`${label} copied. Paste it into a text or email.`); }
  catch (e) { showText(text, label); }
}

function renderBody(d) {
  let html = '';
  if (d.f) html += `<p class="focus">${esc(d.f)}</p>`;
  if (d.b) {
    let open = false;
    const close = () => { if (open) { html += '</ul>'; open = false; } };
    for (const item of d.b) {
      if (item.startsWith('## ')) { close(); html += `<h4>${esc(item.slice(3))}</h4>`; }
      else if (item.startsWith('! ')) { close(); html += `<p>${esc(item.slice(2))}</p>`; }
      else {
        if (!open) { html += '<ul>'; open = true; }
        html += item.startsWith('> ') ? `<li class="subli">${esc(item.slice(2))}</li>` : `<li>${esc(item)}</li>`;
      }
    }
    close();
  }
  return `<div class="prose">${html}</div>`;
}

function planTimes(plan) {
  let t = 0;
  return plan.blocks.map(b => { const at = t; t += Math.max(0, Number(b.min) || 0); return at; });
}
function planTotal(plan) { return plan.blocks.reduce((s, b) => s + Math.max(0, Number(b.min) || 0), 0); }

function planText(plan) {
  const start = toMin(plan.start), times = planTimes(plan);
  const lines = [`${plan.name || 'Practice'}`, `${fmtDate(plan.date)} · ${clock(start)} · ${plan.focus} focus`, ''];
  plan.blocks.forEach((b, i) => {
    lines.push(`${clockShort(start + times[i])} (${offset(times[i])})  ${b.title}${b.min ? ` · ${b.min} min` : ''}`);
    b.drills.forEach(id => DRILL[id] && lines.push(`   • ${DRILL[id].t}`));
  });
  lines.push('', `Ends ${clock(start + planTotal(plan))}`);
  if (plan.notes.trim()) lines.push('', 'Notes:', plan.notes.trim());
  return lines.join('\n');
}

/* ---------- Lineup card generator ---------- */
const POS = ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF'];
const playerLabel = p => `${p.num ? '#' + p.num + ' ' : ''}${p.name || 'Unnamed player'}`;
const canPlay = (p, pos) => String(p.pos || '').toUpperCase().split(/[\s,\/]+/).includes(pos);
function activeRoster() { return state.game.roster.filter(p => p.name.trim() || p.num.trim()); }

function generateLineup() {
  const g = state.game, R = activeRoster();
  if (R.length < 9) { toast(`Add at least 9 players (you have ${R.length})`); return false; }
  const n = Math.max(1, Math.min(9, Number(g.innings) || 6));
  const byId = Object.fromEntries(R.map(p => [p.id, p]));
  const played = Object.fromEntries(R.map(p => [p.id, 0]));
  const grid = Object.fromEntries(R.map(p => [p.id, []]));
  let prev = null;
  for (let i = 0; i < n; i++) {
    let playing;
    if (i === 0) playing = R.slice(0, 9).map(p => p.id);
    else if (!g.rotate || R.length === 9) playing = Object.values(prev);
    else {
      // Pitcher and catcher stay in; everyone else sits in turn, fewest innings played goes in first.
      const sticky = new Set([prev.P, prev.C]);
      playing = [...R].sort((a, b) => (sticky.has(b.id) - sticky.has(a.id)) || (played[a.id] - played[b.id]) || (R.indexOf(a) - R.indexOf(b)))
        .slice(0, 9).map(p => p.id);
    }
    const pool = new Set(playing), assign = {};
    if (prev) for (const pos of POS) if (pool.has(prev[pos])) { assign[pos] = prev[pos]; pool.delete(prev[pos]); }
    for (const pos of POS) {
      if (assign[pos]) continue;
      const open = POS.filter(q => !assign[q] && q !== pos);
      const ids = [...pool];
      const pick = ids.find(id => canPlay(byId[id], pos))
        ?? ids.find(id => !open.some(q => canPlay(byId[id], q)))
        ?? ids[0];
      assign[pos] = pick; pool.delete(pick);
    }
    const posOf = Object.fromEntries(Object.entries(assign).map(([pos, id]) => [id, pos]));
    R.forEach(p => { grid[p.id][i] = posOf[p.id] || 'BN'; if (posOf[p.id]) played[p.id]++; });
    prev = assign;
  }
  g.grid = grid;
  g.order = R.map(p => p.id);
  return true;
}
function lineupRows() {
  const g = state.game, n = Number(g.innings) || 6;
  const byId = Object.fromEntries(g.roster.map(p => [p.id, p]));
  return g.order.filter(id => byId[id]).map(id => {
    const cells = Array.from({ length: n }, (_, i) => (g.grid[id] || [])[i] || 'BN');
    return { id, label: playerLabel(byId[id]), cells, first: cells[0], innings: cells.filter(c => c !== 'BN').length };
  });
}
function inningIssues(rows, i) {
  const used = rows.map(r => r.cells[i]).filter(c => c !== 'BN');
  const missing = POS.filter(p => !used.includes(p));
  const dup = POS.filter(p => used.filter(x => x === p).length > 1);
  return [...missing.map(p => `no ${p}`), ...dup.map(p => `2× ${p}`)];
}

    <div class="card-foot">

  return `

    <div class="table-wrap"><table class="roster"><thead><tr><th>#</th><th>Name</th><th>Can play</th><th></th></tr></thead><tbody>${roster}</tbody></table></div>
    <div><button class="btn" data-act="addPlayer">+ Add player</button></div>
    <div class="row" style="align-items:end">
      <label class="field" style="flex:0 1 120px"><span>Innings</span><select id="gInn" data-gf="innings" data-rerender="1">${[3, 4, 5, 6, 7, 9].map(k => `<option ${Number(g.innings) === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
      <div class="field" style="flex:1 1 220px"><span>Playing time</span>
        <div class="seg" role="group" aria-label="Playing time"><button data-act="rotate" data-v="1" aria-pressed="${!!g.rotate}">Rotate the bench</button><button data-act="rotate" data-v="0" aria-pressed="${!g.rotate}">Same 9 all game</button></div>

    <p class="lede" style="font-size:13px">Rotate the bench keeps your pitcher and catcher in and sits everyone else in turn, so playing time stays even. Edit any cell after generating.</p>
  </section>
  <section class="panel">

      <h2 class="sec">Lineup card${g.opp ? ' vs ' + esc(g.opp) : ''}</h2>

    </div>
    ${card}
    ${rows.length ? `<div class="row no-print"><button class="btn primary" data-act="pdf" data-kind="lineup" data-mode="save">Save PDF</button><button class="btn" data-act="pdf" data-kind="lineup" data-mode="print">Print</button><button class="btn" data-act="copyLineup">Copy as text</button></div>` : ''}
  </section>`;

function gameTrack() {
  const g = state.game;
  const sum = side => FREEBIES.reduce((s, [k]) => s + (g.free[side][k] || 0), 0);
  const us = sum('us'), them = sum('them');
  const war = us < them ? ['good', 'Winning the freebie war'] : us > them ? ['bad', 'Losing the freebie war'] : ['even', 'Freebie war even'];
  const qabPct = Math.min(100, Math.round(g.qab / 18 * 100));
  const tap = (side, k) => `<span class="tap"><button aria-label="${side} ${k} minus" data-act="free" data-side="${side}" data-k="${k}" data-d="-1">−</button><b>${g.free[side][k] || 0}</b><button aria-label="${side} ${k} plus" data-act="free" data-side="${side}" data-k="${k}" data-d="1">+</button></span>`;
  const arms = g.arms.map(a => {
    const p = a.log.length, s = a.log.filter(x => x === 's').length;
    const pct = p ? Math.round(s / p * 100) : 0;
    const lim = Number(a.limit) || 0;
    return `<div class="arm">
      <div class="row" style="justify-content:space-between;align-items:center"><strong>${esc(a.name || 'Unnamed pitcher')} <small style="color:var(--muted)">· ${esc(a.role)}</small></strong></div>
      <div class="arm-stats">
        <span class="${lim && p >= lim ? 'warn' : ''}">Pitches<b>${p}${lim ? `<small style="font-size:16px;color:var(--muted)"> / ${lim}</small>` : ''}</b></span>
        <span>Strikes<b>${s}</b></span>
        <span class="${p >= 5 ? (pct >= 70 ? 'ok' : 'warn') : ''}">Strike %<b>${p ? pct + '%' : '—'}</b></span>
      </div>
      ${lim ? `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, p / lim * 100)}%"></i></div>` : ''}
      <div class="row">
        <button class="btn" data-act="pitch" data-aid="${a.id}" data-v="b">+ Ball</button>
        <button class="btn primary" data-act="pitch" data-aid="${a.id}" data-v="s">+ Strike / in play</button>
        <button class="btn ghost" data-act="pitch" data-aid="${a.id}" data-v="undo" ${p ? '' : 'disabled'}>Undo</button>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="two">
    <section class="panel">
      <h2 class="sec">Quality at-bats</h2>
      <div class="counter">
        <button aria-label="QAB minus" data-act="qab" data-d="-1">−</button>
        <span class="big">${g.qab}</span>
        <button class="plus" aria-label="QAB plus" data-act="qab" data-d="1">+</button>
        <span style="color:var(--muted)">of 18 goal</span>
      </div>
      <div class="bar" aria-hidden="true"><i style="width:${qabPct}%"></i></div>
    </section>
    <section class="panel">
      <h2 class="sec">BASES2</h2>
      <div class="chips">${BASES2.map(([l, name, note], i) => `<button class="filter" title="${esc(note)}" data-act="bases" data-i="${i}" aria-pressed="${!!g.bases[i]}">${l} · ${name}</button>`).join('')}</div>
      <p class="lede" style="font-size:14px">${Object.values(g.bases).filter(Boolean).length} of 6 executed.</p>
    </section>
  </div>
  <section class="panel">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 class="sec">Freebie war</h2>
      <span class="pill ${war[0]}">${war[1]}</span>
    </div>
    <div class="table-wrap"><table class="freebies">
      <thead><tr><th>Freebie</th><th>We gave</th><th>They gave</th></tr></thead>
      <tbody>${FREEBIES.map(([k, n]) => `<tr><td><b>${k}</b> <small style="color:var(--muted)">${n}</small></td><td>${tap('us', k)}</td><td>${tap('them', k)}</td></tr>`).join('')}
        <tr><td><b>Total</b></td><td><b class="big" style="font-size:28px">${us}</b></td><td><b class="big" style="font-size:28px">${them}</b></td></tr></tbody>
    </table></div>
  </section>
  <section class="panel">
    <h2 class="sec">Pitch counts</h2>
    <p class="lede" style="font-size:14px">Goal: 70% strikes. Add or rename pitchers on the Game plan tab.</p>
    ${arms || '<p class="empty">No pitchers yet. Add them on the Game plan tab.</p>'}
  </section>
  <div class="row no-print">
    ${ui.confirm === 'track'
      ? `<span class="callout">Reset QAB’s, freebies, BASES2 and pitch counts?</span><button class="btn danger" data-act="resetTrack">Reset</button><button class="btn ghost" data-act="cancelConfirm">Keep</button>`
      : `<button class="btn ghost danger" data-act="askResetTrack">Reset tracker</button>`}
  </div>`;
}

function fieldSvg(play) {
  const [hx, hy] = FIELD.home, [fx, fy] = FIELD.first, [sx, sy] = FIELD.second, [tx, ty] = FIELD.third;
  const base = (x, y) => `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" class="f-base"/>`;
  const arrows = play.moves ? Object.entries(play.moves).map(([pos, [[x2, y2]]]) => {
    const [x1, y1] = START[pos];
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 6) return '';
    // Stop the arrow at the edge of the player's circle at the destination.
    const ex = x2 - (x2 - x1) / len * 12, ey = y2 - (y2 - y1) / len * 12;
    return `<circle cx="${x1}" cy="${y1}" r="3" class="f-start"/><line x1="${x1}" y1="${y1}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="f-move" marker-end="url(#arrow)"/>`;
  }).join('') : '';
  const players = Object.entries(START).map(([pos, at]) => {
    const moved = play.moves?.[pos];
    const [x, y] = moved ? moved[0] : at;
    return `<g class="f-player${moved ? '' : ' idle'}"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y + 3.6}">${pos}</text></g>`;
  }).join('');
  return `<svg class="field" viewBox="0 0 300 270" role="img" aria-label="${esc(play.name)} bunt coverage diagram">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrowhead"/></marker></defs>
    <path d="M${hx} ${hy} L12 102 A195 195 0 0 1 288 102 Z" class="f-grass"/>
    <path d="M${hx} ${hy} L${fx} ${fy} L${sx} ${sy} L${tx} ${ty} Z" class="f-infield"/>
    <line x1="${hx}" y1="${hy}" x2="12" y2="102" class="f-line"/><line x1="${hx}" y1="${hy}" x2="288" y2="102" class="f-line"/>
    <circle cx="${FIELD.mound[0]}" cy="${FIELD.mound[1]}" r="9" class="f-mound"/>
    ${base(fx, fy)}${base(sx, sy)}${base(tx, ty)}
    <path d="M${hx - 6} ${hy - 6} h12 v6 l-6 6 l-6 -6 z" class="f-base"/>
    ${arrows}${players}
  </svg>`;
}

/* ========================== PDF EXPORT ==========================

const PDF = { W: 612, H: 792, M: 40, ink: [21, 21, 21], muted: [93, 92, 86], line: [224, 223, 216], band: [230, 230, 230], gold: [255, 194, 14], zebra: [247, 247, 244] };
let pdfBadge;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
}
function imageData(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { try { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); res(c.toDataURL('image/png')); } catch (e) { rej(e); } };
    im.onerror = rej; im.src = src;
  });
}
async function newPdf() {
  if (!window.jspdf) { await loadScript('vendor/jspdf.umd.min.js'); await loadScript('vendor/jspdf.plugin.autotable.min.js'); }
  if (pdfBadge === undefined) pdfBadge = await imageData('fca-sports-idaho-clubs.png').catch(() => null);
  return new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
}
// Standard PDF fonts only cover Latin-1, so swap typographic punctuation for plain equivalents.
const pdfSafe = s => String(s ?? '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—−]/g, '-').replace(/→/g, '>').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '');

function pdfHeader(doc, kind, title, meta) {
  const { W, M } = PDF;
  doc.setFillColor(...PDF.band); doc.rect(0, 0, W, 76, 'F');
  if (pdfBadge) doc.addImage(pdfBadge, 'PNG', M, 11, 54, 54);
  let x = M + (pdfBadge ? 66 : 0);
  doc.setTextColor(...PDF.ink); doc.setFontSize(22);
  for (const [word, style] of [['FCA ', 'bold'], ['SPORTS ', 'normal'], ['WAY', 'bold']]) { doc.setFont('helvetica', style); doc.text(word, x, 40); x += doc.getTextWidth(word); }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...PDF.muted);
  doc.setCharSpace(1.6); doc.text(kind.toUpperCase(), M + (pdfBadge ? 66 : 0), 56); doc.setCharSpace(0);
  doc.setFontSize(8); doc.setFont('helvetica', 'normal');
  doc.text('FCA Sports Idaho Clubs', W - M, 40, { align: 'right' });
  doc.text('FCA Coach Guide', W - M, 52, { align: 'right' });
  doc.setTextColor(...PDF.ink); doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  const lines = doc.splitTextToSize(pdfSafe(title), W - 2 * M);
  doc.text(lines, M, 108);
  let y = 108 + (lines.length - 1) * 24;
  if (meta) { doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...PDF.muted); y += 17; doc.text(pdfSafe(meta), M, y); }
  doc.setFillColor(...PDF.gold); doc.rect(M, y + 10, 44, 3.5, 'F');
  return y + 30;
}
function pdfFooters(doc) {
  const { W, H, M } = PDF, n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor(...PDF.line); doc.setLineWidth(0.75); doc.line(M, H - 34, W - M, H - 34);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...PDF.muted);
    doc.text('FCA Sports Way  ·  Develop skills. Grow in Christ. Make an impact.', M, H - 22);
    doc.text(`Page ${i} of ${n}`, W - M, H - 22, { align: 'right' });
  }
}
function pdfSection(doc, y, label) {
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...PDF.ink);
  doc.setCharSpace(1.2); doc.text(label.toUpperCase(), PDF.M, y); doc.setCharSpace(0);
  return y + 12;
}
function pdfRoom(doc, y, need) {
  if (y + need <= PDF.H - 50) return y;
  doc.addPage(); return 50;
}
function pdfTableBase() {
  return {
    margin: { left: PDF.M, right: PDF.M, bottom: 50 },
    theme: 'grid',
    styles: { font: 'helvetica', fontSize: 10, cellPadding: 5, lineColor: PDF.line, lineWidth: 0.75, textColor: PDF.ink, valign: 'middle' },
    headStyles: { fillColor: PDF.ink, textColor: 255, fontStyle: 'bold', fontSize: 9, lineColor: PDF.ink },
    alternateRowStyles: { fillColor: PDF.zebra },
  };
}
function pdfLines(doc, y, n) {
  doc.setDrawColor(...PDF.line); doc.setLineWidth(0.75);
  for (let i = 0; i < n; i++) { y += 20; doc.line(PDF.M, y, PDF.W - PDF.M, y); }
  return y + 8;
}
function pdfBox(doc, x, y, label) {
  doc.setDrawColor(...PDF.ink); doc.setLineWidth(1); doc.rect(x, y - 8.5, 10, 10);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...PDF.ink);
  doc.text(pdfSafe(label), x + 15, y);
}
async function deliverPdf(doc, filename, mode, win) {
  if (mode === 'print') {
    doc.autoPrint();
    const url = doc.output('bloburl');
    if (win) win.location.href = url; else window.open(url, '_blank');
  } else {
    doc.save(filename);
  }
}
const fileSafe = s => pdfSafe(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');

async function practicePdf(mode, win) {
  const plan = curPlan(), doc = await newPdf();
  const start = toMin(plan.start), times = planTimes(plan), total = planTotal(plan);
  let y = pdfHeader(doc, 'FCA Coach Guide', 'Practice Plan',
    [plan.name, fmtDate(plan.date), `${clock(start)} - ${clock(start + total)}`, `${plan.focus} focus`].filter(Boolean).join('  ·  '));
  doc.autoTable({
    ...pdfTableBase(), startY: y,
    head: [['Time', 'Elapsed', 'Block', 'Min', 'Drills']],
    body: plan.blocks.map((b, i) => [clockShort(start + times[i]), offset(times[i]), pdfSafe(b.title), b.min ? String(b.min) : '-',
      pdfSafe(b.drills.filter(id => DRILL[id]).map(id => DRILL[id].t).join('\n'))]),
    columnStyles: { 0: { cellWidth: 46, fontStyle: 'bold' }, 1: { cellWidth: 50, textColor: PDF.muted }, 2: { cellWidth: 170, fontStyle: 'bold' }, 3: { cellWidth: 34, halign: 'center' } },
    didParseCell: d => { if (d.section === 'body' && d.column.index === 2 && /pray|devo/i.test(d.cell.raw)) d.cell.styles.fontStyle = 'bolditalic'; },
  });
  y = doc.lastAutoTable.finalY + 26;
  y = pdfRoom(doc, y, 140);
  y = pdfSection(doc, y, 'Notes for coaches');
  if (plan.notes.trim()) {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...PDF.ink);
    const ls = doc.splitTextToSize(pdfSafe(plan.notes.trim()), PDF.W - 2 * PDF.M);
    for (const l of ls) { y = pdfRoom(doc, y, 16) + 4; doc.text(l, PDF.M, y + 6); y += 10; }
    y += 10;
  } else y = pdfLines(doc, y - 6, 5);

  const used = [...new Set(plan.blocks.flatMap(b => b.drills))].filter(id => DRILL[id]);
  if (ui.pdfDrills !== false && used.length) {
    doc.addPage(); y = pdfHeader(doc, 'Drill Sheets', plan.name || 'Practice', `${used.length} drill${used.length > 1 ? 's' : ''} from the FCA Sports Way Coach Guide`);
    const width = PDF.W - 2 * PDF.M;
    for (const id of used) {
      const d = DRILL[id];
      y = pdfRoom(doc, y, 70);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...PDF.ink); doc.text(pdfSafe(d.t), PDF.M, y);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...PDF.muted);
      doc.text(pdfSafe(`${d.c.toUpperCase()}  ·  ${KINDS[d.k].toUpperCase()}${d.m ? `  ·  ${d.m} MIN` : ''}  ·  GUIDE P. ${d.p}`), PDF.M, y + 13);
      y += 28;
      const para = (text, style = 'normal', indent = 0, size = 10, color = PDF.ink, bullet = '') => {
        doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
        const ls = doc.splitTextToSize(pdfSafe(text), width - indent - (bullet ? 10 : 0));
        ls.forEach((l, i) => { y = pdfRoom(doc, y, 14); if (bullet && i === 0) doc.text(bullet, PDF.M + indent, y); doc.text(l, PDF.M + indent + (bullet ? 10 : 0), y); y += size + 3.5; });
      };
      para(d.s);
      if (d.f) { y += 2; para('Focus: ' + d.f, 'bold'); }
      for (const item of d.b || []) {
        if (item.startsWith('## ')) { y += 4; para(item.slice(3).toUpperCase(), 'bold', 0, 8.5, PDF.muted); }
        else if (item.startsWith('! ')) para(item.slice(2), 'italic');
        else if (item.startsWith('> ')) para(item.slice(2), 'normal', 14, 9.5, PDF.muted, '-');
        else para(item, 'normal', 0, 10, PDF.ink, '•');
      }
      y += 8; doc.setDrawColor(...PDF.line); doc.setLineWidth(0.75); doc.line(PDF.M, y, PDF.W - PDF.M, y); y += 20;
    }
  }
  pdfFooters(doc);
  await deliverPdf(doc, `FCA-Practice-${fileSafe(plan.name) || 'Plan'}-${plan.date || ''}.pdf`, mode, win);
}

  askNewGame() { ui.confirm = 'game'; render(); },
  newGame() { state.game = blankGame(); ui.confirm = null; save(); render(); toast('Ready for a new game'); },
  qab(el) { state.game.qab = Math.max(0, state.game.qab + Number(el.dataset.d)); save(); render(); },
  free(el) { const f = state.game.free[el.dataset.side]; f[el.dataset.k] = Math.max(0, (f[el.dataset.k] || 0) + Number(el.dataset.d)); save(); render(); },
  bases(el) { const g = state.game; g.bases[el.dataset.i] = !g.bases[el.dataset.i]; save(); render(); },
  pitch(el) { const a = arm(el.dataset.aid); if (el.dataset.v === 'undo') a.log.pop(); else a.log.push(el.dataset.v); save(); render(); },
  addPlayer() { state.game.roster.push({ id: uid(), num: '', name: '', pos: '' }); save(); render(); },
  rmPlayer(el) { const g = state.game; g.roster = g.roster.filter(p => p.id !== el.dataset.pid); g.order = g.order.filter(id => id !== el.dataset.pid); delete g.grid[el.dataset.pid]; save(); render(); },
  rotate(el) { state.game.rotate = el.dataset.v === '1'; save(); render(); },
  genLineup() { if (generateLineup()) { save(); render(); toast('Lineup card generated'); } },
  moveBat(el) { const o = state.game.order, i = o.indexOf(el.dataset.pid), j = i + Number(el.dataset.d); if (j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; save(); render(); },
  bunt(el) { ui.bunt = Number(el.dataset.n); render(); },
  jump(el) { document.getElementById(el.dataset.to)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  pdf(el) { makePdf(el.dataset.kind, el.dataset.mode); },
  copyLineup() { copyText(lineupText(), 'Lineup'); },
  newDevo() { const d = blankDevo(); state.devos.unshift(d); state.curDevo = d.id; ui.confirm = null; save(); render(); document.getElementById('dv-title')?.focus(); },
  devoSetting(el) { curDevo().setting = el.dataset.v; save(); render(); },
  addQ() { curDevo().questions.push(''); save(); render(); document.getElementById('dq-' + (curDevo().questions.length - 1))?.focus(); },
  copyDevo() { copyText(devoText(curDevo()), 'Devo'); },
  askDelDevo() { ui.confirm = 'devo'; render(); },
  delDevo() { state.devos = state.devos.filter(d => d.id !== state.curDevo); if (!state.devos.length) state.devos.push(blankDevo()); state.curDevo = state.devos[0].id; ui.confirm = null; save(); render(); toast('Devo deleted'); },
  askResetTrack() { ui.confirm = 'track'; render(); },
  resetTrack() { const g = state.game; g.qab = 0; g.free = { us: {}, them: {} }; g.bases = {}; g.arms.forEach(a => a.log = []); ui.confirm = null; save(); render(); toast('Tracker reset'); },
};
document.addEventListener('click', e => {
  const go2 = e.target.closest('[data-tab-go]'); if (go2) { go(go2.dataset.tabGo); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act] && !el.disabled) ACTIONS[el.dataset.act](el);
});

document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.pf) {
    const p = curPlan(); p[d.pf] = el.value; save();
    const opt = document.querySelector(`#planSel option[value="${p.id}"]`);
    if (opt) opt.textContent = (p.name || 'Untitled practice') + (p.date ? ' · ' + fmtDate(p.date) : '');
  }
  else if (d.bf === 'title') { block(d.bid).title = el.value; save(); }
  else if (d.gf) { state.game[d.gf] = el.value; save(); }
  else if (d.ro) {
    const p = state.game.roster.find(x => x.id === d.pid); p[d.ro] = el.value; save();
    const cell = document.querySelector(`[data-nm="${p.id}"]`); if (cell) cell.textContent = playerLabel(p);
  }
  else if (d.dv) {
    const v = curDevo(); v[d.dv] = el.value; save();
    const opt = document.querySelector(`#devoSel option[value="${v.id}"]`);
    if (opt) opt.textContent = (v.title || 'Untitled devo') + (v.date ? ' · ' + fmtDate(v.date) : '');
  }
  else if (d.dq) { curDevo().questions[Number(d.dq)] = el.value; save(); }
  else if (d.arm) { arm(d.aid)[d.arm] = el.value; save(); }
  else if (d.input === 'q') { ui.q = el.value; document.getElementById('libGrid').innerHTML = libCards(filteredDrills(ui.q, ui.cat)); }
  else if (d.input === 'pickQ') { ui.pick.q = el.value; document.getElementById('pickList').innerHTML = pickItems(); }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.change === 'selPlan') { state.cur = el.value; ui.confirm = null; save(); render(); }
  else if (d.change === 'selDevo') { state.curDevo = el.value; ui.confirm = null; save(); render(); }
  else if (d.cell) { const g = state.game; (g.grid[d.pid] ||= [])[Number(d.cell)] = el.value; save(); render(); }
  else if (d.bf === 'min') { block(d.bid).min = Math.max(0, Number(el.value) || 0); save(); render(); }
  else if (d.pf === 'start') { render(); }
  else if (d.rerender) { render(); }
  else if (d.opt) { ui[d.opt] = el.checked; }
  else if (d.check) { state.checks[d.check] = el.checked; save(); render(); }
});

go(location.hash.slice(1) || 'practice');
</script>
</body>
</html>
