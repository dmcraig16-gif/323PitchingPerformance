<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCA Coach Guide has moved</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F4F4F1; color: #151515; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #111110; color: #F1F0EA; } a { color: #FFC20E; } }
  h1 { font-size: 24px; margin: 0 0 8px; }
  a { color: #151515; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>The FCA Coach Guide has moved</h1>
  <p>Taking you to <a id="go" href="https://fcaforce.github.io/Coachresource/">fcaforce.github.io/Coachresource</a>…</p>
  <p>Please update your bookmark or home-screen icon.</p>
</main>
<script>
// Forward to the new address, carrying this device's saved plans, roster and devos so nothing is lost.
(function () {
  var NEW = 'https://fcaforce.github.io/Coachresource/';
  var tab = (location.hash || '').slice(1).replace(/[^a-z]/g, '');
  var url = NEW + (tab ? '#' + tab : '');
  try {
    var saved = localStorage.getItem('fcaSportsWay.v1');
    if (saved) {
      var b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ 'fcaSportsWay.v1': saved }))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      url = NEW + '#import=' + b64 + (tab ? '&tab=' + tab : '');
    }
  } catch (e) {}
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
