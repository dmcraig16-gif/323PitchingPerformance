  function axis(f, max, fmt) {
    var out = '';
    for (var i = 0; i <= 4; i++) {
      var v = max * i / 4, y = f.m.t + f.ih - f.ih * i / 4;
      out += '<line class="grid" x1="' + f.m.l + '" x2="' + (f.w - f.m.r) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<text class="tick" x="' + (f.m.l - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + esc(fmt(v, true)) + '</text>';
    }
    return out;
  }

  function xLabels(f, labels, x, every) {
    return labels.map(function (l, i) {
      if (i % every !== 0 && i !== labels.length - 1) return '';
      var anchor = i === 0 && every > 1 ? 'start' : (i === labels.length - 1 && labels.length > 1 && x(i) > f.w - f.m.r - 20 ? 'end' : 'middle');
      return '<text class="tick" x="' + x(i) + '" y="' + (f.h - 8) + '" text-anchor="' + anchor + '">' + esc(l) + '</text>';
    }).join('');
  }

  function hover(wrap, f, labels, series, fmt, x, crosshair) {
    var svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip'), cross = wrap.querySelector('.cross');
    function show(evt) {
      var r = svg.getBoundingClientRect();
      var px = (evt.clientX - r.left) * (f.w / r.width);
      var best = 0, bd = Infinity;
      labels.forEach(function (_, i) { var d = Math.abs(x(i) - px); if (d < bd) { bd = d; best = i; } });
      tip.innerHTML = '<b>' + esc(labels[best]) + '</b>' + series.map(function (s) {
        return '<div><i style="background:' + s.color + '"></i>' + esc(s.name) + ' <span>' + esc(fmt(s.values[best])) + '</span></div>';
      }).join('');
      tip.hidden = false;
      var left = x(best) / f.w * r.width;
      tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
      if (crosshair && cross) { cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.style.display = ''; }
    }
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', function () { tip.hidden = true; if (cross) cross.style.display = 'none'; });
  }

  /** Stacked bars. data: { labels, series: [{ name, color, values }], fmt } */
  H.stackedBars = function (el, data) {
    var f = frame(el, data);
    var n = data.labels.length;
    var totals = data.labels.map(function (_, i) { return data.series.reduce(function (s, x) { return s + (x.values[i] || 0); }, 0); });
    var max = niceMax(Math.max.apply(null, totals.concat([0])));
    var band = f.iw / n, bw = Math.max(6, Math.min(36, band * 0.6));
    var x = function (i) { return f.m.l + band * i + band / 2; };
    var y = function (v) { return f.ih * v / max; };
    var bars = '';
    data.labels.forEach(function (_, i) {
      var base = f.m.t + f.ih;
      var segs = data.series.filter(function (s) { return (s.values[i] || 0) > 0; });
      segs.forEach(function (s, k) {
        var hgt = y(s.values[i]);
        var top = k === segs.length - 1;
        var gap = k > 0 ? 2 : 0;
        var yy = base - hgt;
        var r = top ? Math.min(4, bw / 2, hgt - gap) : 0;
        var hh = Math.max(0, hgt - gap);
        bars += r > 0
          ? '<path fill="' + s.color + '" d="M' + (x(i) - bw / 2) + ',' + (yy + hh) + 'V' + (yy + r) + 'Q' + (x(i) - bw / 2) + ',' + yy + ' ' + (x(i) - bw / 2 + r) + ',' + yy +
            'H' + (x(i) + bw / 2 - r) + 'Q' + (x(i) + bw / 2) + ',' + yy + ' ' + (x(i) + bw / 2) + ',' + (yy + r) + 'V' + (yy + hh) + 'Z"/>'
          : '<rect fill="' + s.color + '" x="' + (x(i) - bw / 2) + '" y="' + yy + '" width="' + bw + '" height="' + hh + '"/>';
        base = yy;
      });
    });
    el.innerHTML = legend(data.series) + '<div class="chart"><svg viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="' + esc(data.title || 'Chart') + '">' +
      axis(f, max, data.fmt) + bars + '<line class="axis" x1="' + f.m.l + '" x2="' + (f.w - f.m.r) + '" y1="' + (f.m.t + f.ih) + '" y2="' + (f.m.t + f.ih) + '"/>' +
      xLabels(f, data.labels, x, n > 8 && f.w < 500 ? 2 : 1) + '</svg><div class="tip" hidden></div></div>' +
      table(data.labels, data.series, data.fmt);
    hover(el.querySelector('.chart'), f, data.labels, data.series, data.fmt, x, false);
  };

  /** Line chart. data: { labels, series: [{ name, color, values }], fmt } */
  H.lineChart = function (el, data) {
    var f = frame(el, data);
    var n = data.labels.length;
    var all = [];
    data.series.forEach(function (s) { s.values.forEach(function (v) { all.push(v || 0); }); });
    var max = niceMax(Math.max.apply(null, all.concat([0])));
    var x = function (i) { return n === 1 ? f.m.l + f.iw / 2 : f.m.l + f.iw * i / (n - 1); };
    var y = function (v) { return f.m.t + f.ih - f.ih * (v || 0) / max; };
    var lines = data.series.map(function (s) {
      var d = s.values.map(function (v, i) { return (i ? 'L' : 'M') + x(i) + ',' + y(v); }).join('');
      var dots = s.values.map(function (v, i) { return '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4" fill="' + s.color + '" stroke="#0d0f12" stroke-width="2"/>'; }).join('');
      return '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>' + (n <= 26 ? dots : '');
    }).join('');
    var every = Math.ceil(n / Math.max(1, Math.floor(f.iw / 64)));
    el.innerHTML = legend(data.series) + '<div class="chart"><svg viewBox="0 0 ' + f.w + ' ' + f.h + '" role="img" aria-label="' + esc(data.title || 'Chart') + '">' +
      axis(f, max, data.fmt) + '<line class="cross" y1="' + f.m.t + '" y2="' + (f.m.t + f.ih) + '" style="display:none"/>' + lines +
      xLabels(f, data.labels, x, every) + '</svg><div class="tip" hidden></div></div>' +
      table(data.labels, data.series, data.fmt);
    hover(el.querySelector('.chart'), f, data.labels, data.series, data.fmt, x, true);
  };
})(window.Hub);
</script>

<script>
/* To-Do screen: Today, Tomorrow, This week, Overdue. */
(function (H) {
  'use strict';
  var esc = H.esc, fmtDate = H.fmtDate, mins = H.mins;
  var S = { data: null, at: 0, mode: 'today' };
  H.onStale(function () { S.at = 0; });

  function addDays(ymd, n) {
    var p = ymd.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
  }
  function shortDay(ymd) { return H.dayName(ymd).slice(0, 3) + ' ' + fmtDate(ymd).replace(/\/\d{4}$/, ''); }

  H.views.todo = function (opts) {
    if (opts.mode) S.mode = opts.mode;
    if (S.data && !opts.fresh && Date.now() - S.at < 60000) return render();
    if (!S.data) H.view.innerHTML = '<h1>To-Do</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getTodos', !!opts.fresh).then(function (d) {
      S.data = d; S.at = Date.now();
      if (H.state.tab === 'todo') render();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function overdue(d) {
    return d.tasks.filter(function (t) { return t.date < d.today && !t.done; });
  }

  function selected() {
    var d = S.data, t = d.today;
    if (S.mode === 'today') return d.tasks.filter(function (x) { return x.date === t; });
    if (S.mode === 'tomorrow') return d.tasks.filter(function (x) { return x.date === addDays(t, 1); });
    if (S.mode === 'week') { var end = addDays(d.weekStart, 6); return d.tasks.filter(function (x) { return x.date >= d.weekStart && x.date <= end; }); }
    return overdue(d);
  }

  function modeDate() {
    var t = S.data.today;
    if (S.mode === 'tomorrow') return addDays(t, 1);
    return t;
  }

  function render() {
    var d = S.data;
    var list = selected();
    var od = overdue(d).length;
    var tabs = [['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'This week'], ['overdue', 'Overdue']];
    var h = '<div class="row-between"><h1>To-Do</h1><button class="btn small" data-todo-add>Add task</button></div>';
    h += '<div class="seg">' + tabs.map(function (x) {
      var badge = x[0] === 'overdue' && od ? ' <span class="count red-bg">' + od + '</span>' : '';
      return '<button data-mode="' + x[0] + '" class="' + (S.mode === x[0] ? 'on' : '') + '">' + x[1] + badge + '</button>';
    }).join('') + '</div>';

    var planned = 0, done = 0;
    list.forEach(function (t) { planned += t.minutes; if (t.done) done += t.minutes; });
    if (S.mode !== 'overdue') {
      var pct = planned ? Math.round(done / planned * 100) : 0;
      h += '<div class="row-between sub" style="margin-top:14px"><span>' + mins(done) + ' done of ' + mins(planned) + ' planned</span><span>' + mins(planned - done) + ' left</span></div>';
      h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    }

    if (S.mode === 'overdue' && list.length) {
      h += '<button class="btn full" data-move-overdue style="margin-top:14px">Move all ' + list.length + ' to today</button>';
    }

    if (!list.length) {
      h += '<div class="list" style="margin-top:14px"><div class="empty">' +
        (S.mode === 'overdue' ? 'Nothing overdue.' : 'No tasks here yet.') + '</div></div>';
      H.view.innerHTML = h;
      return;
    }

    if (S.mode === 'week' || S.mode === 'overdue') {
      var days = {}, order = [];
      list.forEach(function (t) { if (!days[t.date]) { days[t.date] = []; order.push(t.date); } days[t.date].push(t); });
      order.sort();
      order.forEach(function (day) {
        var p = 0, dn = 0;
        days[day].forEach(function (t) { p += t.minutes; if (t.done) dn += t.minutes; });
        h += '<h2 class="row-between"><span>' + esc(shortDay(day)) + (day === d.today ? ' <span class="key">Today</span>' : '') + '</span><span class="sub">' + mins(dn) + ' / ' + mins(p) + '</span></h2>';
        h += blocksHtml(days[day], true);
      });
    } else {
      h += '<div style="margin-top:14px">' + blocksHtml(list, false) + '</div>';
    }
    H.view.innerHTML = h;
  }

  function blocksHtml(tasks, compact) {
    var groups = {}, order = [];
    tasks.forEach(function (t) { if (!groups[t.block]) { groups[t.block] = []; order.push(t.block); } groups[t.block].push(t); });
    var h = '<div class="list">';
    order.forEach(function (b) {
      var p = 0, dn = 0;
      groups[b].forEach(function (t) { p += t.minutes; if (t.done) dn += t.minutes; });
      h += '<div class="group-label row-between"><span>' + esc(b) + '</span><span class="sub">' + (compact ? '' : mins(dn) + ' / ' + mins(p)) + '</span></div>';
      groups[b].forEach(function (t) {
        h += '<div class="task-row' + (t.done ? ' done' : '') + '">' +
          '<button class="task-check" data-check="' + t.row + '" aria-label="Done"><span class="check"></span></button>' +
          '<button class="task-body" data-edit="' + t.row + '"><span class="txt">' + esc(t.task) + '</span>' +
          (t.minutes ? '<span class="mins">' + t.minutes + 'm</span>' : '') + '</button></div>';
      });
    });
    return h + '</div>';
  }

  function find(row) { return S.data.tasks.filter(function (t) { return t.row === row; })[0]; }

  function toggle(row, btn) {
    var t = find(row);
    if (!t || btn.disabled) return;
    var next = !t.done;
    t.done = next; btn.disabled = true;
    render();
    H.api('setTaskDone', row, t.task, next).then(function () {
      H.invalidate();
    }).catch(function (m) {
      t.done = !next; render(); H.toast(m, true);
    });
  }

  function moveOverdue(btn) {
    var items = overdue(S.data).map(function (t) { return { row: t.row, task: t.task }; });
    if (!items.length) return;
    btn.disabled = true; btn.textContent = 'Moving';
    H.api('moveTasks', items, S.data.today).then(function (r) {
      H.toast('Moved ' + r.moved + ' to today' + (r.failed ? '. ' + r.failed + ' changed in the sheet, refresh and retry.' : ''));
      H.invalidate();
      S.mode = 'today';
      H.views.todo({ fresh: true });
    }).catch(function (m) { btn.disabled = false; H.toast(m, true); });
  }

  function openEdit(row) {
    var t = find(row);
    if (!t) return;
    var blocks = S.data.blocks.slice();
    if (blocks.indexOf(t.block) < 0) blocks.push(t.block);
    var today = S.data.today;
    var nextMon = addDays(S.data.weekStart, 7);
    H.openSheet(
      '<form class="form" id="taskForm" data-row="' + t.row + '"><h2>Edit task</h2>' +
      '<label class="field"><span>Task</span><textarea name="Task">' + esc(t.task) + '</textarea></label>' +
      '<label class="field"><span>Block</span><input name="Block" list="blockList" value="' + esc(t.block) + '" autocomplete="off">' +
      '<datalist id="blockList">' + blocks.map(function (b) { return '<option value="' + esc(b) + '">'; }).join('') + '</datalist></label>' +
      '<label class="field"><span>Minutes</span><input name="Minutes" inputmode="numeric" value="' + esc(t.minutes || '') + '"></label>' +
      '<label class="field"><span>Date</span><input type="date" name="Date" value="' + esc(t.date) + '"></label>' +
      '<div class="chips"><span class="sub">Move to</span>' +
      '<button type="button" class="chip" data-move="' + today + '">Today</button>' +
      '<button type="button" class="chip" data-move="' + addDays(today, 1) + '">Tomorrow</button>' +
      '<button type="button" class="chip" data-move="' + nextMon + '">Next Monday</button></div>' +
      '<div class="form-error" hidden></div>' +
      '<div class="form-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></form>'
    );
  }

  document.getElementById('sheet').addEventListener('click', function (e) {
    var mv = e.target.closest('[data-move]');
    if (mv) {
      var f = document.getElementById('taskForm');
      if (f) f.elements['Date'].value = mv.getAttribute('data-move');
    }
  });

  document.getElementById('sheet').addEventListener('submit', function (e) {
    if (e.target.id !== 'taskForm') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var f = e.target, row = Number(f.getAttribute('data-row')), t = find(row);
    var changes = {};
    var v = { Task: f.elements['Task'].value.trim(), Block: f.elements['Block'].value.trim(), Minutes: f.elements['Minutes'].value.trim(), Date: f.elements['Date'].value };
    if (v.Task !== t.task) changes.Task = v.Task;
    if (v.Block !== t.block) changes.Block = v.Block;
    if (String(v.Minutes) !== String(t.minutes || '')) changes.Minutes = v.Minutes;
    if (v.Date !== t.date) changes.Date = v.Date;
    if (!Object.keys(changes).length) return H.closeSheet();
    var err = f.querySelector('.form-error');
    if (!v.Task) { err.textContent = 'Task cannot be blank.'; err.hidden = false; return; }
    var btn = f.querySelector('[type=submit]');
    btn.disabled = true; btn.textContent = 'Saving';
    H.api('updateTask', row, t.task, changes).then(function () {
      H.closeSheet();
      H.toast(changes.Date ? 'Moved to ' + fmtDate(changes.Date) : 'Saved');
      H.invalidate();
      H.views.todo({ fresh: true });
    }).catch(function (m) {
      btn.disabled = false; btn.textContent = 'Save';
      err.textContent = m; err.hidden = false;
    });
  }, true);

  H.handlers.todo = {
    click: function (e) {
      var m = e.target.closest('[data-mode]');
      if (m) { S.mode = m.getAttribute('data-mode'); H.state.opts.mode = S.mode; return render(); }
      var c = e.target.closest('[data-check]');
      if (c) return toggle(Number(c.getAttribute('data-check')), c);
      var ed = e.target.closest('[data-edit]');
      if (ed) return openEdit(Number(ed.getAttribute('data-edit')));
      var mo = e.target.closest('[data-move-overdue]');
      if (mo) return moveOverdue(mo);
      if (e.target.closest('[data-todo-add]')) {
        H.openForm('Daily To-Do', { Date: modeDate() }, function () { H.views.todo({ fresh: true }); });
      }
    }
  };
})(window.Hub);
</script>

<script>
/* Clients list and client profile. */
(function (H) {
  'use strict';
  var esc = H.esc, fmtDate = H.fmtDate, money = H.money;
  var S = { list: null, at: 0, q: '', program: '', status: 'current', pay: '', profile: null };
  H.onStale(function () { S.at = 0; });

  H.views.clients = function (opts) {
    if (opts.row) return loadProfile(opts.row, opts.fresh);
    S.profile = null;
    if (S.list && !opts.fresh && Date.now() - S.at < 60000) return renderList();
    if (!S.list) H.view.innerHTML = '<h1>Clients</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getClients', !!opts.fresh).then(function (d) {
      S.list = d; S.at = Date.now();
      if (H.state.tab === 'clients' && !H.state.opts.row) renderList();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function badge(pay) {
    if (!pay) return '';
    var cls = pay === 'Paid' ? 'ok' : pay === 'Due' ? 'due' : pay === 'Overdue' ? 'over' : 'neutral';
    return '<span class="badge ' + cls + '">' + esc(pay) + '</span>';
  }
  H.payBadge = badge;

  function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>'; }

  function renderList() {
    var d = S.list;
    var h = '<div class="row-between"><h1>Clients</h1><button class="btn small" data-add-client>Add client</button></div>';
    h += '<input class="search" type="search" placeholder="Search athlete, parent, email" data-q value="' + esc(S.q) + '">';
    h += '<div class="filters">' +
      '<select data-f="program">' + opt('', 'All programs', S.program) + d.programs.map(function (p) { return opt(p, p, S.program); }).join('') + '</select>' +
      '<select data-f="status">' + opt('current', 'Active + Onboarding', S.status) + opt('', 'All statuses', S.status) + d.statuses.map(function (s) { return opt(s, s, S.status); }).join('') + '</select>' +
      '<select data-f="pay">' + opt('', 'Any payment', S.pay) + ['Paid', 'Due', 'Overdue', 'No charge', 'Prepaid'].map(function (s) { return opt(s, s, S.pay); }).join('') + '</select>' +
      '</div><div id="clientRows"></div>';
    H.view.innerHTML = h;
    renderRows();
  }

  function renderRows() {
    var q = S.q.toLowerCase();
    var rows = S.list.clients.filter(function (c) {
      if (q && [c.athlete, c.parent, c.email].join(' ').toLowerCase().indexOf(q) < 0) return false;
      if (S.program && c.program !== S.program) return false;
      if (S.status === 'current' && ['Active', 'Onboarding'].indexOf(c.status) < 0) return false;
      if (S.status && S.status !== 'current' && c.status !== S.status) return false;
      if (S.pay && c.pay !== S.pay) return false;
      return true;
    });
    var el = document.getElementById('clientRows');
    if (!rows.length) { el.innerHTML = '<div class="list"><div class="empty">No clients match.</div></div>'; return; }
    el.innerHTML = '<div class="list">' + rows.map(function (c) {
      var rate = c.rate === '' || c.rate == null ? '' : (typeof c.rate === 'number' ? money(c.rate) + '/mo' : esc(c.rate));
      return '<button class="client-row" data-client="' + c.row + '">' +
        '<div class="row-between"><span class="t">' + esc(c.athlete) + H.tagHtml(c.tag) + '</span>' + badge(c.pay) + '</div>' +
        '<div class="d">' + [esc(c.program), esc(c.plan), rate, esc(c.status)].filter(Boolean).join(' · ') + '</div>' +
        (c.endsSoon ? '<div class="d warn">Term ends in ' + c.daysLeft + ' days. Talk renewal.</div>' : '') +
        '</button>';
    }).join('') + '</div>';
  }

  /* ---------- profile ---------- */

  function loadProfile(row, fresh) {
    if (!S.profile || S.profile.row !== row) H.view.innerHTML = '<div class="skeleton" style="height:420px"></div>';
    H.setBusy(true);
    return H.api('getClient', row, !!fresh).then(function (p) {
      S.profile = p;
      if (H.state.tab === 'clients' && H.state.opts.row === row) renderProfile();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  }

  function fieldInput(f) {
    var name = esc(f.name), v = f.value;
    if (f.computed) {
      var shown = f.type === 'date' ? fmtDate(v) : (typeof v === 'number' && /rate|amount/i.test(f.name) ? money(v) : esc(v));
      return '<div class="ro">' + (shown || '<span class="sub">blank</span>') + ' <span class="sub">(formula)</span></div>';
    }
    if (f.type === 'bool') return '<input type="checkbox" data-field="' + name + '"' + (v === true ? ' checked' : '') + '>';
    if (f.choices) {
      return '<select data-field="' + name + '"><option value=""></option>' + f.choices.map(function (c) {
        return '<option' + (String(c) === String(v) ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('') + '</select>';
    }
    if (f.type === 'date') return '<input type="date" data-field="' + name + '" value="' + esc(H.ymd(v)) + '">';
    if (f.type === 'number') return '<input inputmode="decimal" data-field="' + name + '" value="' + esc(v) + '">';
    return '<input data-field="' + name + '" value="' + esc(v) + '" autocomplete="off">';
  }

  function renderProfile() {
    var p = S.profile, t = p.term;
    var h = '<button class="back" data-back>Clients</button>';
    h += '<h1>' + esc(p.athlete) + '</h1><div class="sub">' + H.tagHtml(p.tag).replace('margin-left:6px', '') + ' ' + badge(p.pay) + '</div>';

    // Quick actions
    h += '<div class="actions">';
    h += p.links.email
      ? '<a class="btn ghost" href="mailto:' + esc(p.links.email) + '" target="_top">Email parent</a>' +
        '<button class="btn ghost" data-copy="' + esc(p.links.email) + '">Copy ' + esc(p.links.email) + '</button>'
      : '<button class="btn ghost" disabled>No parent email</button>';
    if (H.isUrl(p.links.payment)) h += '<button class="btn ghost" data-copy="' + esc(p.links.payment) + '">Copy payment link</button>';
    else h += '<button class="btn ghost" disabled>' + (p.links.payment ? 'Pays by ' + esc(p.links.payment) : 'No payment link') + '</button>';
    h += H.isUrl(p.links.agreement) ? '<a class="btn ghost" href="' + esc(p.links.agreement) + '" target="_blank" rel="noopener">Open agreement</a>' : '<button class="btn ghost" disabled>No agreement link</button>';
    h += '</div>';

    // Term
    h += '<h2>Term</h2><div class="list kv">' +
      kv('Start date', fmtDate(t.start)) + kv('Term ends', fmtDate(t.ends)) + kv('Term', t.months ? esc(t.months) + ' months' : '') +
      kv('Months in', t.monthsIn == null ? '' : t.monthsIn) +
      kv('Days left', t.daysLeft == null ? '' : (t.daysLeft < 0 ? 'Ended ' + (-t.daysLeft) + ' days ago' : t.daysLeft)) +
      '</div>';
    if (t.endsSoon) h += '<div class="notice">Term ends in ' + t.daysLeft + ' days. Talk renewal.</div>';

    // Onboarding
    h += '<h2>Onboarding</h2><div class="list">' + p.onboarding.map(function (o) {
      return '<button class="task-row onb' + (o.done ? ' done' : '') + '" data-onb="' + esc(o.name) + '"' + (o.computed ? ' disabled' : '') + '>' +
        '<span class="check"></span><span class="txt">' + esc(o.name) + '</span></button>';
    }).join('') + '</div>';

    // Payments
    h += '<h2>Payments</h2><div class="list kv">' +
      kv('This month', esc(p.paidThisMonth) + ' ' + badge(p.pay === p.paidThisMonth ? '' : p.pay)) +
      kv('Next payment due', fmtDate(p.nextDue) || '<span class="sub">none set</span>') +
      kv('Total paid to date', money(p.totalPaid)) + '</div>';
    h += p.payments.length ? '<div class="list" style="margin-top:10px">' + p.payments.map(function (x) {
      return '<div class="item"><div style="flex:1"><div class="row-between"><span class="t">' + money(x.amount) + '</span><span class="sub">' + fmtDate(x.date) + '</span></div>' +
        '<div class="d">' + [esc(x.method), esc(x.status), x.notes ? esc(x.notes) : ''].filter(Boolean).join(' · ') + '</div></div></div>';
    }).join('') + '</div>' : '<div class="list" style="margin-top:10px"><div class="empty">No payments logged.</div></div>';
    h += '<button class="btn ghost full" data-log-payment style="margin-top:10px">Log payment</button>';

    // Wins
    h += '<h2>Wins</h2>';
    h += p.wins.length ? '<div class="list">' + p.wins.map(function (w) {
      return '<div class="item"><div style="flex:1"><div class="row-between"><span class="t">' + esc(w['Win']) + '</span><span class="sub">' + fmtDate(w['Date']) + '</span></div>' +
        '<div class="d">' + esc(w['Area'] || '') + (w['Evidence'] ? ' · ' + esc(w['Evidence']) : '') + '</div>' +
        H.consentHtml(w) + '</div></div>';
    }).join('') + '</div>' : '<div class="list"><div class="empty">No wins logged yet.</div></div>';
    h += '<button class="btn ghost full" data-log-win style="margin-top:10px">Log win</button>';

    // Notes
    h += '<h2>Notes</h2><div class="notes" id="notesBox">' + (p.notes ? esc(p.notes) : '<span class="sub">No notes yet.</span>') + '</div>' +
      '<label class="field"><span>Add a note</span><textarea id="newNote" placeholder="What happened"></textarea></label>' +
      '<div class="form-actions"><button class="btn ghost" data-edit-notes>Edit all</button><button class="btn" data-add-note>Add note</button></div>';

    // Details
    h += '<h2>All fields</h2><div class="list fields">' + p.fields.filter(function (f) {
      return f.name !== 'Notes' && p.onboarding.every(function (o) { return o.name !== f.name; });
    }).map(function (f) {
      return '<label class="frow"><span class="fl">' + esc(f.name) + '</span><span class="fv">' + fieldInput(f) + '</span><span class="saved" data-saved="' + esc(f.name) + '"></span></label>';
    }).join('') + '</div>';

    H.view.innerHTML = h;
  }

  function kv(k, v) { return '<div class="kvrow"><span class="sub">' + esc(k) + '</span><span>' + (v === '' || v == null ? '<span class="sub">-</span>' : v) + '</span></div>'; }

  function save(changes, afterOk) {
    var p = S.profile;
    return H.api('updateClient', p.row, p.athlete, changes).then(function (res) {
      if (res.skipped && res.skipped.length) H.toast(res.skipped.join(', ') + ' not saved (formula).', true);
      if (changes['Athlete name'] !== undefined && res.written.indexOf('Athlete name') >= 0) p.athlete = changes['Athlete name'];
      H.invalidate();
      if (afterOk) afterOk(res);
      // Formula columns (Term ends, Paid this month) may have changed. Reload quietly.
      return H.api('getClient', p.row, true).then(function (fresh) {
        S.profile = fresh;
        var a = document.activeElement;
        var typing = a && H.view.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
        if (!typing && H.state.tab === 'clients' && H.state.opts.row === fresh.row) renderProfile();
      });
    }).catch(function (m) { H.toast(m, true); throw m; });
  }

  function saveField(el) {
    var name = el.getAttribute('data-field');
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (name === 'Athlete name' && !String(v).trim()) { H.toast('Athlete name cannot be blank.', true); el.value = S.profile.athlete; return; }
    var mark = H.view.querySelector('[data-saved="' + CSS.escape(name) + '"]');
    if (mark) mark.textContent = 'Saving';
    var c = {}; c[name] = v;
    save(c, function () { if (mark) mark.textContent = 'Saved'; }).catch(function () { if (mark) mark.textContent = ''; });
  }

  function toggleOnb(btn) {
    var name = btn.getAttribute('data-onb');
    var o = S.profile.onboarding.filter(function (x) { return x.name === name; })[0];
    if (!o || btn.disabled) return;
    o.done = !o.done;
    btn.classList.toggle('done', o.done);
    btn.disabled = true;
    var c = {}; c[name] = o.done;
    save(c).catch(function () { o.done = !o.done; btn.classList.toggle('done', o.done); }).then(function () { btn.disabled = false; });
  }

  function addNote(btn) {
    var ta = document.getElementById('newNote');
    var text = ta.value.trim();
    if (!text) return H.toast('Type a note first.', true);
    btn.disabled = true;
    H.api('addClientNote', S.profile.row, S.profile.athlete, text).then(function (notes) {
      S.profile.notes = notes; ta.value = '';
      document.getElementById('notesBox').textContent = notes;
      H.toast('Note added');
    }).catch(function (m) { H.toast(m, true); }).then(function () { btn.disabled = false; });
  }

  function editNotes() {
    H.openSheet('<form class="form" id="notesForm"><h2>Edit notes</h2><label class="field"><span>Notes</span>' +
      '<textarea name="notes" style="min-height:300px">' + esc(S.profile.notes) + '</textarea></label>' +
      '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></form>');
  }

  document.getElementById('sheet').addEventListener('submit', function (e) {
    if (e.target.id !== 'notesForm') return;
    e.preventDefault(); e.stopImmediatePropagation();
    var btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    save({ Notes: e.target.elements['notes'].value }).then(function () { H.closeSheet(); H.toast('Notes saved'); })
      .catch(function () { btn.disabled = false; });
  }, true);

  H.handlers.clients = {
    click: function (e) {
      var c = e.target.closest('[data-client]');
      if (c) return H.go('clients', { row: Number(c.getAttribute('data-client')) });
      if (e.target.closest('[data-back]')) return H.go('clients');
      if (e.target.closest('[data-add-client]')) return H.openForm('Clients', {}, function () { H.views.clients({ fresh: true }); });
      var cp = e.target.closest('[data-copy]');
      if (cp) return H.copyText(cp.getAttribute('data-copy'));
      var op = e.target.closest('[data-open]');
      if (op) return window.open(op.getAttribute('data-open'), '_blank', 'noopener');
      var onb = e.target.closest('[data-onb]');
      if (onb) return toggleOnb(onb);
      var an = e.target.closest('[data-add-note]');
      if (an) return addNote(an);
      if (e.target.closest('[data-edit-notes]')) return editNotes();
      var reload = function () { H.views.clients({ row: S.profile.row, fresh: true }); };
      if (e.target.closest('[data-log-payment]')) return H.openForm('Payments', { Athlete: S.profile.athlete }, reload);
      if (e.target.closest('[data-log-win]')) return H.openForm('Wins', { Athlete: S.profile.athlete }, reload);
    },
    change: function (e) {
      if (e.target.matches('[data-field]')) return saveField(e.target);
      var f = e.target.getAttribute('data-f');
      if (f) { S[f] = e.target.value; renderRows(); }
    },
    input: function (e) {
      if (e.target.matches('[data-q]')) { S.q = e.target.value; renderRows(); }
    }
  };
})(window.Hub);
</script>

<script>
/* Leads pipeline: kanban on desktop, grouped list on phone, lead profile, convert to client. */
(function (H) {
  'use strict';
  var esc = H.esc, fmtDate = H.fmtDate;
  var S = { d: null, at: 0, q: '', open: { Lost: false } };
  H.onStale(function () { S.at = 0; });

  H.views.leads = function (opts) {
    if (S.d && !opts.fresh && Date.now() - S.at < 60000) return opts.row ? renderProfile(opts.row) : renderBoard();
    if (!S.d) H.view.innerHTML = '<h1>Leads</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    return H.api('getLeads', !!opts.fresh).then(function (d) {
      S.d = d; S.at = Date.now();
      if (H.state.tab !== 'leads') return;
      if (H.state.opts.row) renderProfile(H.state.opts.row); else renderBoard();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };
  H.leadsStale = function () { S.at = 0; };

  function name(l) { return l['Athlete name'] || l['Parent name'] || l['Contact (IG or email)'] || 'Lead'; }
  function expect(l) { return { 'Parent name': l['Parent name'] == null ? '' : l['Parent name'], 'Athlete name': l['Athlete name'] == null ? '' : l['Athlete name'] }; }
  function find(row) { return S.d.leads.filter(function (l) { return l.row === row; })[0]; }

  function card(l) {
    var due = H.ymd(l['Next action due']);
    var sub = [l['Athlete name'] && l['Parent name'] ? 'Parent: ' + l['Parent name'] : '', l['Grad year'] ? 'Class of ' + l['Grad year'] : '', l['Source']].filter(Boolean).map(esc).join(' · ');
    return '<div class="lead-card' + (l._overdue ? ' overdue' : '') + '" draggable="true" data-lead="' + l.row + '">' +
      '<button class="lead-open" data-open-lead="' + l.row + '"><span class="t">' + esc(name(l)) + '</span>' +
      (sub ? '<span class="d">' + sub + '</span>' : '') +
      (l['Next action'] || due ? '<span class="d na">' + esc(l['Next action'] || 'Next action') + (due ? ' · ' + fmtDate(due) : '') + '</span>' : '') +
      '</button><select class="stage-pick" data-stage-for="' + l.row + '" aria-label="Stage">' +
      S.d.stages.map(function (s) { return '<option' + (s === l['Stage'] ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
      '</select></div>';
  }

  function renderBoard() {
    var d = S.d, q = S.q.toLowerCase();
    var leads = d.leads.filter(function (l) {
      return !q || [l['Parent name'], l['Athlete name'], l['Contact (IG or email)'], l['Notes']].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var by = {};
    d.stages.forEach(function (s) { by[s] = []; });
    var other = [];
    leads.forEach(function (l) { (by[l['Stage']] || other).push(l); });
    if (other.length) by['No stage'] = other;
    var stages = d.stages.concat(other.length ? ['No stage'] : []);
    var od = d.leads.filter(function (l) { return l._overdue; }).length;

    var h = '<div class="row-between"><h1>Leads</h1><button class="btn small" data-add-lead>Add lead</button></div>';
    if (d.discoveryLink) h += '<div class="linkrow"><span class="sub">Discovery call link</span><button class="chip" data-copy="' + esc(d.discoveryLink) + '">Copy</button></div>';
    if (od) h += '<div class="notice red-text">' + od + ' follow-up' + (od > 1 ? 's' : '') + ' overdue</div>';
    h += '<input class="search" type="search" placeholder="Search leads" data-lq value="' + esc(S.q) + '">';
    h += '<div class="board">' + stages.map(function (s) {
      var list = by[s];
      var collapsed = S.open[s] === false;
      return '<section class="col' + (collapsed ? ' collapsed' : '') + '" data-col="' + esc(s) + '">' +
        '<button class="col-head" data-toggle-col="' + esc(s) + '"><span>' + esc(s) + '</span><span class="count">' + list.length + '</span></button>' +
        '<div class="col-body">' + (list.length ? list.map(card).join('') : '<div class="empty small">None</div>') + '</div></section>';
    }).join('') + '</div>';
    H.view.innerHTML = h;
  }

  function moveStage(row, stage, onDone) {
    var l = find(row);
    if (!l || l['Stage'] === stage) return;
    var prev = l['Stage'], prevTouch = l['Last touch'];
    l['Stage'] = stage; l['Last touch'] = S.d.today;
    H.api('updateLead', row, expect(l), { Stage: stage }).then(function () {
      H.invalidate();
      H.toast('Moved to ' + stage);
      if (stage === 'Won') offerConvert(l);
      if (onDone) onDone();
    }).catch(function (m) {
      l['Stage'] = prev; l['Last touch'] = prevTouch; H.toast(m, true);
      if (H.state.opts.row) renderProfile(row); else renderBoard();
    });
    if (H.state.opts.row) renderProfile(row); else renderBoard();
  }

  /* ---------- profile ---------- */
  function input(f, v) {
    var n = esc(f.name);
    if (f.computed) return '<div class="ro">' + (f.type === 'date' ? fmtDate(v) : esc(v)) + ' <span class="sub">(formula)</span></div>';
    if (f.type === 'bool') return '<input type="checkbox" data-lf="' + n + '"' + (v === true ? ' checked' : '') + '>';
    if (f.choices) return '<select data-lf="' + n + '"><option value=""></option>' + f.choices.map(function (c) { return '<option' + (String(c) === String(v) ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>';
    if (f.type === 'date') return '<input type="date" data-lf="' + n + '" value="' + esc(H.ymd(v)) + '">';
    if (f.type === 'number') return '<input inputmode="decimal" data-lf="' + n + '" value="' + esc(v) + '">';
    return '<input data-lf="' + n + '" value="' + esc(v) + '" autocomplete="off">';
  }
  function fieldOf(name) { return S.d.fields.filter(function (f) { return f.name === name; })[0]; }

  function renderProfile(row) {
    var l = find(row);
    if (!l) { H.toast('Lead not found. Refresh.', true); return renderBoard(); }
    var h = '<button class="back" data-back>Leads</button><h1>' + esc(name(l)) + '</h1>';
    h += '<div class="sub">Last touch ' + (fmtDate(l['Last touch']) || '-') + (l['Contact (IG or email)'] ? ' · ' + esc(l['Contact (IG or email)']) : '') + '</div>';

    h += '<div class="panel' + (l._overdue ? ' overdue' : '') + '"><div class="label">Next action</div>' +
      '<label class="field"><span>Next action</span>' + input(fieldOf('Next action') || { name: 'Next action' }, l['Next action']) + '</label>' +
      '<label class="field"><span>Due</span>' + input(fieldOf('Next action due') || { name: 'Next action due', type: 'date' }, l['Next action due']) + '</label>' +
      (l._overdue ? '<div class="red-text">Overdue</div>' : '') + '</div>';

    h += '<h2>Stage</h2><div class="chips wrap">' + S.d.stages.map(function (s) {
      return '<button class="chip' + (s === l['Stage'] ? ' on' : '') + '" data-set-stage="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('') + '</div>';
    h += '<button class="btn' + (l['Stage'] === 'Won' ? '' : ' ghost') + ' full" data-convert style="margin-top:12px">Convert to client</button>';

    h += '<h2>Notes</h2><div class="notes" id="leadNotes">' + (l['Notes'] ? esc(l['Notes']) : '<span class="sub">No notes yet.</span>') + '</div>' +
      '<label class="field"><span>Add a note</span><textarea id="leadNewNote" placeholder="What happened"></textarea></label>' +
      '<button class="btn full" data-lead-note>Add note</button>';

    var skip = ['Next action', 'Next action due', 'Stage', 'Notes'];
    h += '<h2>All fields</h2><div class="list fields">' + S.d.fields.filter(function (f) { return skip.indexOf(f.name) < 0; }).map(function (f) {
      return '<label class="frow"><span class="fl">' + esc(f.name) + '</span><span class="fv">' + input(f, l[f.name]) + '</span><span class="saved" data-lsaved="' + esc(f.name) + '"></span></label>';
    }).join('') + '</div>';
    H.view.innerHTML = h;
  }

  function saveField(el) {
    var row = H.state.opts.row, l = find(row);
    var n = el.getAttribute('data-lf');
    var v = el.type === 'checkbox' ? el.checked : el.value;
    var mark = H.view.querySelector('[data-lsaved="' + CSS.escape(n) + '"]');
    if (mark) mark.textContent = 'Saving';
    var ex = expect(l);
    var c = {}; c[n] = v;
    H.api('updateLead', row, ex, c).then(function (res) {
      if (res.skipped.length) H.toast(res.skipped.join(', ') + ' not saved (formula).', true);
      l[n] = v; if (mark) mark.textContent = 'Saved';
      if (n === 'Next action due') {
        l._overdue = !!v && v < S.d.today && ['Won', 'Lost'].indexOf(l['Stage']) < 0;
      }
      H.invalidate();
    }).catch(function (m) { if (mark) mark.textContent = ''; H.toast(m, true); });
  }

  function addNote(btn) {
    var row = H.state.opts.row, l = find(row);
    var ta = document.getElementById('leadNewNote');
    if (!ta.value.trim()) return H.toast('Type a note first.', true);
    btn.disabled = true;
    H.api('addLeadNote', row, expect(l), ta.value.trim()).then(function (r) {
      l['Notes'] = r.notes; l['Last touch'] = r.lastTouch; ta.value = '';
      renderProfile(row);
      H.toast('Note added. Last touch set to today.');
    }).catch(function (m) { H.toast(m, true); }).then(function () { btn.disabled = false; });
  }

  /** Prefill a new Clients row from the lead. The form is the confirm step: nothing is written until Save. */
  function offerConvert(l) {
    var contact = String(l['Contact (IG or email)'] || '');
    var isEmail = /@.+\./.test(contact) && contact.charAt(0) !== '@';
    var program = S.d.programs.indexOf(l['Program interest']) >= 0 ? l['Program interest'] : '';
    var note = 'Converted from lead' + (contact ? '. Contact: ' + contact : '') + (l['Source'] ? '. Source: ' + l['Source'] : '');
    H.openForm('Clients', {
      'Athlete name': l['Athlete name'] || '', 'Parent name': l['Parent name'] || '',
      'Parent email': isEmail ? contact : '', 'Program': program, 'Notes': note
    }, function (res) {
      H.toast('Client added to row ' + res.row + '. Check the new client in Clients.');
    });
    setTimeout(function () {
      var h2 = document.querySelector('#sheet form h2');
      if (h2) h2.insertAdjacentHTML('afterend', '<p class="sub">Check these details, then Save to add ' + esc(name(l)) + ' to Clients. Nothing is written until you tap Save.</p>');
    }, 50);
  }

  /* drag and drop between columns (desktop) */
  var dragRow = null;
  H.view.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('[data-lead]');
    if (c && H.state.tab === 'leads') { dragRow = Number(c.getAttribute('data-lead')); e.dataTransfer.effectAllowed = 'move'; }
  });
  H.view.addEventListener('dragover', function (e) { if (dragRow && e.target.closest('[data-col]')) e.preventDefault(); });
  H.view.addEventListener('drop', function (e) {
    var col = e.target.closest('[data-col]');
    if (dragRow && col) { e.preventDefault(); var s = col.getAttribute('data-col'); if (s !== 'No stage') moveStage(dragRow, s); }
    dragRow = null;
  });

  H.handlers.leads = {
    click: function (e) {
      var o = e.target.closest('[data-open-lead]');
      if (o) return H.go('leads', { row: Number(o.getAttribute('data-open-lead')) });
      if (e.target.closest('[data-back]')) return H.go('leads');
      if (e.target.closest('[data-add-lead]')) return H.openForm('Leads', {}, function () { H.views.leads({ fresh: true }); });
      var cp = e.target.closest('[data-copy]');
      if (cp) return H.copyText(cp.getAttribute('data-copy'));
      var t = e.target.closest('[data-toggle-col]');
      if (t) { var s = t.getAttribute('data-toggle-col'); S.open[s] = S.open[s] === false; return renderBoard(); }
      var st = e.target.closest('[data-set-stage]');
      if (st) return moveStage(H.state.opts.row, st.getAttribute('data-set-stage'));
      var n = e.target.closest('[data-lead-note]');
      if (n) return addNote(n);
      if (e.target.closest('[data-convert]')) return offerConvert(find(H.state.opts.row));
    },
    change: function (e) {
      var sp = e.target.getAttribute('data-stage-for');
      if (sp) return moveStage(Number(sp), e.target.value);
      if (e.target.matches('[data-lf]')) return saveField(e.target);
    },
    input: function (e) {
      if (e.target.matches('[data-lq]')) {
        S.q = e.target.value;
        var pos = e.target.selectionStart;
        renderBoard();
        var el = H.view.querySelector('[data-lq]'); el.focus(); el.setSelectionRange(pos, pos);
      }
    }
  };
})(window.Hub);
</script>

<script>
/* Money: cash by month chart, 323 vs DDC, net and tax set-aside, payments, expenses. */
(function (H) {
  'use strict';
  var esc = H.esc, fmtDate = H.fmtDate, money = H.money;
  var S = { d: null, at: 0, tab: 'payments', pf: '', pq: '' };
  H.onStale(function () { S.at = 0; });
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  H.views.money = function (opts) {
    if (S.d && !opts.fresh && Date.now() - S.at < 60000) return render();
    if (!S.d) H.view.innerHTML = '<h1>Money</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getMoney', !!opts.fresh).then(function (d) {
      S.d = d; S.at = Date.now();
      if (H.state.tab === 'money') render();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function short(v, axis) {
    var n = H.num(v);
    if (axis && n >= 1000) return '$' + (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'k';
    return money(n);
  }

  function monthLabel(v) {
    var s = String(v);
    if (/^\d{4}-\d{2}/.test(s)) return MONTHS[Number(s.slice(5, 7)) - 1];
    return s;
  }

  function render() {
    var d = S.d, m = d.month;
    var h = '<h1>Money</h1>';

    h += '<div class="cards">' +
      card('Cash in this month', money(m.cashIn), true) +
      card('Spent this month', money(m.spent)) +
      card('Net this month', money(m.net)) +
      card('Tax set-aside (' + Math.round(m.taxRate * 100) + '%)', money(m.tax)) +
      card('Left after tax', money(m.left)) +
      card('Cash in, year to date', money(d.ytd.cashIn)) +
      '</div>';

    h += '<h2>323 vs DDC</h2><div class="list kv">' +
      '<div class="kvrow three"><span class="sub"></span><span class="sub">This month</span><span class="sub">Year to date</span></div>' +
      d.split.month.map(function (c, i) {
        var tag = /ddc/i.test(c.name) ? H.tagHtml('DDC') : '';
        return '<div class="kvrow three"><span>' + esc(c.name) + tag + '</span><span>' + money(c.value) + '</span><span>' + money(d.split.ytd[i].value) + '</span></div>';
      }).join('') + '</div>';
    h += '<div class="sub" style="margin-top:6px">DDC money is Venmo and not counted in 323 MRR.</div>';

    h += '<h2>Cash collected by month</h2><div id="cashChart"></div>';

    h += '<div class="seg" style="margin-top:28px">' +
      '<button data-mtab="payments" class="' + (S.tab === 'payments' ? 'on' : '') + '">Payments</button>' +
      '<button data-mtab="expenses" class="' + (S.tab === 'expenses' ? 'on' : '') + '">Expenses</button></div>';
    h += '<div id="mlist"></div>';
    H.view.innerHTML = h;

    var rows = d.cash.rows.filter(function (r) { return /^\d{4}-\d{2}/.test(String(r[d.cash.headers[0]])); });
    var segCols = d.cash.cols.filter(function (c) { return !/^total$/i.test(c); });
    var colors = { 0: '#0289eb', 1: '#d28e05' };
    H.stackedBars(document.getElementById('cashChart'), {
      title: 'Cash collected by month',
      labels: rows.map(function (r) { return monthLabel(r[d.cash.headers[0]]); }),
      series: segCols.map(function (c, i) {
        return { name: c, color: colors[i] || H.SERIES[i], values: rows.map(function (r) { return H.num(r[c]); }) };
      }),
      fmt: short
    });
    renderList();
  }

  function card(label, v, accent) {
    return '<div class="card' + (accent ? ' accent' : '') + '"><div class="label">' + esc(label) + '</div><div class="num">' + esc(v) + '</div></div>';
  }

  function renderList() {
    var d = S.d, el = document.getElementById('mlist');
    var h = '';
    if (S.tab === 'payments') {
      h += '<div class="row-between" style="margin:14px 0 10px"><select data-pf>' +
        ['', '323', 'DDC', 'Guinea Pig'].map(function (v) { return '<option value="' + v + '"' + (S.pf === v ? ' selected' : '') + '>' + (v || 'All payments') + '</option>'; }).join('') +
        '</select><button class="btn small" data-log="Payments">Log payment</button></div>';
      h += '<input class="search" type="search" placeholder="Search athlete" data-pq value="' + esc(S.pq) + '">';
      var q = S.pq.toLowerCase();
      var list = d.payments.filter(function (p) {
        return (!S.pf || p.tag === S.pf) && (!q || String(p.athlete).toLowerCase().indexOf(q) >= 0);
      });
      var total = list.reduce(function (s, p) { return s + p.amount; }, 0);
      h += '<div class="sub">' + list.length + ' payments · ' + money(total) + '</div>';
      h += list.length ? '<div class="list" style="margin-top:8px">' + list.map(function (p) {
        var st = /overdue/i.test(p.status) ? '<span class="badge over">' + esc(p.status) + '</span>' : (p.status ? '<span class="sub">' + esc(p.status) + '</span>' : '');
        return '<div class="item"><div style="flex:1"><div class="row-between"><span class="t">' + esc(p.athlete) + H.tagHtml(p.tag) + '</span><span class="t">' + money(p.amount) + '</span></div>' +
          '<div class="row-between d"><span>' + fmtDate(p.date) + (p.method ? ' · ' + esc(p.method) : '') + (p.nextDue ? ' · next due ' + fmtDate(p.nextDue) : '') + '</span>' + st + '</div>' +
          (p.notes ? '<div class="d">' + esc(p.notes) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>' : '<div class="list" style="margin-top:8px"><div class="empty">No payments.</div></div>';
    } else {
      h += '<div class="row-between" style="margin:14px 0 10px"><span class="sub">This month ' + money(d.month.spent) + ' · Year to date ' + money(d.ytd.spent) + '</span>' +
        '<button class="btn small" data-log="Expenses">Log expense</button></div>';
      h += d.expenses.length ? '<div class="list">' + d.expenses.map(function (e) {
        var link = H.isUrl(e['Receipt link']) ? ' · <a href="' + esc(e['Receipt link']) + '" target="_blank" rel="noopener">Receipt</a>' : '';
        return '<div class="item"><div style="flex:1"><div class="row-between"><span class="t">' + esc(e['Vendor'] || '') + '</span><span class="t">' + money(e.amount) + '</span></div>' +
          '<div class="d">' + [fmtDate(e.date), esc(e['Category'] || ''), esc(e["What it's for"] || ''), esc(e['Billing'] || '')].filter(Boolean).join(' · ') + link + '</div></div></div>';
      }).join('') + '</div>' : '<div class="list"><div class="empty">No expenses.</div></div>';
    }
    el.innerHTML = h;
  }

  H.handlers.money = {
    click: function (e) {
      var t = e.target.closest('[data-mtab]');
      if (t) { S.tab = t.getAttribute('data-mtab'); return render(); }
      var l = e.target.closest('[data-log]');
      if (l) return H.openForm(l.getAttribute('data-log'), {}, function () { H.views.money({ fresh: true }); });
    },
    change: function (e) { if (e.target.matches('[data-pf]')) { S.pf = e.target.value; renderList(); } },
    input: function (e) {
      if (e.target.matches('[data-pq]')) {
        S.pq = e.target.value;
        var pos = e.target.selectionStart;
        renderList();
        var el = H.view.querySelector('[data-pq]'); el.focus(); el.setSelectionRange(pos, pos);
      }
    }
  };
})(window.Hub);
</script>

<script>
/* Content, Wins, Scorecard history, and a shared row editor. */
(function (H) {
  'use strict';
  var esc = H.esc, fmtDate = H.fmtDate;

  /* ---------- shared: consent badge for wins ---------- */
  // Media consent values in the sheet: Full, Face and name hidden, None.
  H.consentHtml = function (w) {
    var consent = String(w['Media consent'] == null ? '' : w['Media consent']).trim();
    var ok = w['OK to post'] === true;
    var hidden = /hidden/i.test(consent);
    var full = /^full$/i.test(consent);
    if (ok && (full || hidden)) {
      return '<div class="consent ' + (hidden ? 'warn' : 'ok') + '">OK to post' + (hidden ? ' · hide face and name' : ' · full consent') + '</div>';
    }
    var why = [];
    if (!full && !hidden) why.push(consent && !/^none$/i.test(consent) ? 'consent: ' + consent : 'no media consent');
    if (!ok) why.push('not marked OK to post');
    return '<div class="consent no">Do not post · ' + esc(why.join(', ')) + '</div>';
  };

  /* ---------- shared: edit any row on an allowed tab ---------- */
  var editSpecs = {};
  H.editRecord = function (tab, rec, expectKeys, onSaved) {
    var p = editSpecs[tab] ? Promise.resolve(editSpecs[tab]) : H.api('getEditSpec', tab);
    p.then(function (spec) {
      editSpecs[tab] = spec;
      var h = '<form class="form" id="editForm" data-tab="' + esc(tab) + '" data-row="' + rec.row + '"><h2>Edit</h2>';
      h += spec.fields.map(function (f) {
        var v = rec[f.name], n = esc(f.name), inp;
        if (f.type === 'bool') return '<label class="field bool"><input type="checkbox" name="' + n + '"' + (v === true ? ' checked' : '') + '><span>' + n + '</span></label>';
        if (f.choices && f.choiceSource === 'list') inp = '<select name="' + n + '"><option value=""></option>' + f.choices.map(function (c) { return '<option' + (String(c) === String(v) ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>';
        else if (f.type === 'date') inp = '<input type="date" name="' + n + '" value="' + esc(H.ymd(v)) + '">';
        else if (/notes|teaching point|hook|^win$|evidence/i.test(f.name)) inp = '<textarea name="' + n + '">' + esc(v) + '</textarea>';
        else inp = '<input name="' + n + '" value="' + esc(v) + '"' + (f.type === 'number' ? ' inputmode="decimal"' : '') + ' autocomplete="off">';
        return '<label class="field"><span>' + n + '</span>' + inp + '</label>';
      }).join('');
      h += '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></form>';
      H.openSheet(h);
      H.state.editCtx = { rec: rec, spec: spec, expectKeys: expectKeys, onSaved: onSaved };
    }).catch(function (m) { H.toast(m, true); });
  };

  document.getElementById('sheet').addEventListener('submit', function (e) {
    if (e.target.id !== 'editForm') return;
    e.preventDefault(); e.stopImmediatePropagation();
    var ctx = H.state.editCtx, f = e.target, changes = {};
    ctx.spec.fields.forEach(function (fd) {
      var el = f.elements[fd.name];
      if (!el) return;
      var v = fd.type === 'bool' ? el.checked : el.value;
      var old = ctx.rec[fd.name];
      var same = fd.type === 'bool' ? (old === true) === v : (fd.type === 'date' ? H.ymd(old) === v : String(old == null ? '' : old) === String(v));
      if (!same) changes[fd.name] = v;
    });
    if (!Object.keys(changes).length) return H.closeSheet();
    var expect = {};
    ctx.expectKeys.forEach(function (k) { expect[k] = ctx.rec[k] == null ? '' : ctx.rec[k]; });
    var btn = f.querySelector('[type=submit]'), err = f.querySelector('.form-error');
    btn.disabled = true; btn.textContent = 'Saving';
    H.api('updateRecord', f.getAttribute('data-tab'), ctx.rec.row, expect, changes).then(function (res) {
      H.closeSheet();
      H.toast(res.skipped.length ? 'Saved. Skipped formula cells: ' + res.skipped.join(', ') : 'Saved');
      if (ctx.onSaved) ctx.onSaved();
    }).catch(function (m) { btn.disabled = false; btn.textContent = 'Save'; err.textContent = m; err.hidden = false; });
  }, true);

  /* ---------- Content ---------- */
  var C = { d: null, at: 0, pillar: '', status: '', mode: 'list', month: null };
  H.onStale(function () { C.at = 0; });

  H.views.content = function (opts) {
    if (C.d && !opts.fresh && Date.now() - C.at < 60000) return renderContent();
    H.view.innerHTML = '<h1>Content</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getContent', !!opts.fresh).then(function (d) {
      C.d = d; C.at = Date.now();
      if (!C.month) C.month = d.today.slice(0, 7);
      if (H.state.tab === 'content') renderContent();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function sel(attr, cur, all, label) {
    return '<select ' + attr + '><option value="">' + esc(label) + '</option>' + all.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
  }

  function renderContent() {
    var d = C.d;
    var h = '<button class="back" data-go="more">More</button><div class="row-between"><h1>Content</h1><button class="btn small" data-add-post>Add post</button></div>';
    var top = d.stale[0];
    if (top) {
      h += '<div class="notice">' + (top.days === null
        ? esc(top.pillar) + ' has not been posted yet.'
        : esc(top.pillar) + ' is the longest without a post: ' + top.days + ' days (last ' + fmtDate(top.last) + ').') + '</div>';
    }
    h += '<div class="list kv">' + d.stale.map(function (s) {
      return '<div class="kvrow"><span>' + esc(s.pillar) + '</span><span class="sub">' + (s.last ? fmtDate(s.last) + ' · ' + s.days + 'd ago' : 'never') + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="sub" style="margin-top:6px">' + (d.postedRule === 'status' ? 'Counts posts whose Status says posted.' : 'Counts posts dated today or earlier. No Status value says posted yet.') + '</div>';
    h += '<div class="filters" style="margin-top:16px">' + sel('data-cf="pillar"', C.pillar, d.pillars, 'All pillars') + sel('data-cf="status"', C.status, d.statuses, 'All statuses') + '</div>';
    h += '<div class="seg"><button data-cmode="list" class="' + (C.mode === 'list' ? 'on' : '') + '">List</button><button data-cmode="cal" class="' + (C.mode === 'cal' ? 'on' : '') + '">Calendar</button></div>';
    h += '<div id="contentBody"></div>';
    H.view.innerHTML = h;
    renderContentBody();
  }

  function filteredPosts() {
    return C.d.posts.filter(function (p) {
      return (!C.pillar || p['Pillar'] === C.pillar) && (!C.status || p['Status'] === C.status);
    });
  }

  function postItem(p) {
    return '<button class="client-row" data-edit-post="' + p.row + '"><div class="row-between"><span class="t">' + esc(p['Topic'] || p['Hook'] || 'Post') + '</span><span class="sub">' + (fmtDate(p.date) || 'no date') + '</span></div>' +
      '<div class="d">' + [p['Pillar'], p['Format'], p['Status']].filter(Boolean).map(esc).join(' · ') + '</div>' +
      (p['Hook'] ? '<div class="d">' + esc(p['Hook']) + '</div>' : '') + '</button>';
  }

  function renderContentBody() {
    var el = document.getElementById('contentBody');
    var posts = filteredPosts();
    if (C.mode === 'list') {
      posts = posts.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      el.innerHTML = posts.length ? '<div class="list" style="margin-top:12px">' + posts.map(postItem).join('') + '</div>' : '<div class="list" style="margin-top:12px"><div class="empty">No posts match.</div></div>';
      return;
    }
    var y = Number(C.month.slice(0, 4)), m = Number(C.month.slice(5, 7));
    var first = new Date(Date.UTC(y, m - 1, 1)), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var lead = (first.getUTCDay() + 6) % 7;
    var byDay = {};
    posts.forEach(function (p) { if (p.date && p.date.slice(0, 7) === C.month) (byDay[p.date] = byDay[p.date] || []).push(p); });
    var h = '<div class="row-between cal-head"><button class="chip" data-cal="-1">Prev</button><b>' + first.toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }) + '</b><button class="chip" data-cal="1">Next</button></div>';
    h += '<div class="cal">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (x) { return '<div class="cal-dow">' + x + '</div>'; }).join('');
    for (var i = 0; i < lead; i++) h += '<div class="cal-cell empty"></div>';
    for (var dd = 1; dd <= days; dd++) {
      var key = C.month + '-' + ('0' + dd).slice(-2);
      var ps = byDay[key] || [];
      h += '<div class="cal-cell' + (key === C.d.today ? ' today' : '') + '"><span class="cal-n">' + dd + '</span>' +
        ps.map(function (p) { return '<button class="cal-post" data-edit-post="' + p.row + '" title="' + esc(p['Topic'] || '') + '">' + esc(p['Topic'] || p['Format'] || 'Post') + '</button>'; }).join('') + '</div>';
    }
    h += '</div>';
    var undated = posts.filter(function (p) { return !p.date; });
    if (undated.length) h += '<h2>No date</h2><div class="list">' + undated.map(postItem).join('') + '</div>';
    el.innerHTML = h;
  }

  H.handlers.content = {
    click: function (e) {
      if (e.target.closest('[data-go]')) return H.go('more');
      if (e.target.closest('[data-add-post]')) return H.openForm('Content', {}, function () { H.views.content({ fresh: true }); });
      var md = e.target.closest('[data-cmode]');
      if (md) { C.mode = md.getAttribute('data-cmode'); return renderContent(); }
      var cal = e.target.closest('[data-cal]');
      if (cal) {
        var y = Number(C.month.slice(0, 4)), m = Number(C.month.slice(5, 7)) - 1 + Number(cal.getAttribute('data-cal'));
        var d = new Date(Date.UTC(y, m, 1));
        C.month = d.toISOString().slice(0, 7);
        return renderContentBody();
      }
      var ep = e.target.closest('[data-edit-post]');
      if (ep) {
        var row = Number(ep.getAttribute('data-edit-post'));
        var rec = C.d.posts.filter(function (p) { return p.row === row; })[0];
        return H.editRecord('Content', rec, ['Topic'], function () { H.views.content({ fresh: true }); });
      }
    },
    change: function (e) {
      var f = e.target.getAttribute('data-cf');
      if (f) { C[f] = e.target.value; renderContentBody(); }
    }
  };

  /* ---------- Wins ---------- */
  var W = { d: null, at: 0, athlete: '' };
  H.onStale(function () { W.at = 0; });

  H.views.wins = function (opts) {
    if (W.d && !opts.fresh && Date.now() - W.at < 60000) return renderWins();
    H.view.innerHTML = '<h1>Wins</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getWins', !!opts.fresh).then(function (d) {
      W.d = d; W.at = Date.now();
      if (H.state.tab === 'wins') renderWins();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function renderWins() {
    var d = W.d;
    var h = '<button class="back" data-go="more">More</button><div class="row-between"><h1>Wins</h1><button class="btn small" data-add-win>Log win</button></div>';
    h += '<div class="filters">' + sel('data-wf', W.athlete, d.athletes, 'All athletes') + '</div>';
    var list = d.wins.filter(function (w) { return !W.athlete || w['Athlete'] === W.athlete; });
    h += list.length ? '<div class="list">' + list.map(function (w) {
      return '<button class="client-row" data-edit-win="' + w.row + '"><div class="row-between"><span class="t">' + esc(w['Athlete'] || '') + '</span><span class="sub">' + fmtDate(w['Date']) + '</span></div>' +
        '<div class="d">' + esc(w['Win'] || '') + (w['Area'] ? ' · ' + esc(w['Area']) : '') + '</div>' +
        (w['Evidence'] ? '<div class="d">' + esc(w['Evidence']) + '</div>' : '') + H.consentHtml(w) + '</button>';
    }).join('') + '</div>' : '<div class="list"><div class="empty">No wins logged yet.</div></div>';
    H.view.innerHTML = h;
  }

  H.handlers.wins = {
    click: function (e) {
      if (e.target.closest('[data-go]')) return H.go('more');
      if (e.target.closest('[data-add-win]')) return H.openForm('Wins', W.athlete ? { Athlete: W.athlete } : {}, function () { H.views.wins({ fresh: true }); });
      var ew = e.target.closest('[data-edit-win]');
      if (ew) {
        var row = Number(ew.getAttribute('data-edit-win'));
        var rec = W.d.wins.filter(function (w) { return w.row === row; })[0];
        return H.editRecord('Wins', rec, ['Athlete', 'Win'], function () { H.views.wins({ fresh: true }); });
      }
    },
    change: function (e) { if (e.target.matches('[data-wf]')) { W.athlete = e.target.value; renderWins(); } }
  };


  /* ---------- Social ---------- */
  var SO = { d: null, at: 0 };
  H.onStale(function () { SO.at = 0; });

  H.views.social = function (opts) {
    if (SO.d && !opts.fresh && Date.now() - SO.at < 60000) return renderSocial();
    if (!SO.d) H.view.innerHTML = '<h1>Social</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getSocial', !!opts.fresh).then(function (d) {
      SO.d = d; SO.at = Date.now();
      if (H.state.tab === 'social') renderSocial();
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function socFmt(name, v) {
    if (v === '' || v == null) return '';
    if (typeof v !== 'number') return esc(v);
    if (/%/.test(name)) return (v > 0 ? '+' : '') + (Math.round(v * 1000) / 10) + '%';
    if (/gained/i.test(name)) return (v > 0 ? '+' : '') + v.toLocaleString('en-US');
    return v.toLocaleString('en-US');
  }
  function isInput(c) { return c.group && !/^both/i.test(c.group) && !/gained|growth/i.test(c.name); }

  function renderSocial() {
    var d = SO.d;
    var h = '<button class="back" data-go="more">More</button><div class="row-between"><h1>Social</h1><button class="btn small" data-soc-log>Log this week</button></div>';
    var last = d.rows[d.rows.length - 1];
    var weekLogged = last && H.ymd(last[d.weekKey]) === d.thisMonday;
    h += '<div class="notice' + (weekLogged ? '' : ' red-text') + '">' + (weekLogged
      ? 'This week (' + fmtDate(d.thisMonday) + ') is logged.'
      : 'This week (' + fmtDate(d.thisMonday) + ') is not logged yet. Pull the numbers from Instagram Insights and tap Log this week.') + '</div>';

    // Snapshot
    h += '<h2>Snapshot</h2><div class="scroll-x"><table><thead><tr><th></th>' + d.allAccounts.map(function (a) { return '<th>' + esc(a) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      d.snapshot.map(function (s) {
        return '<tr><th>' + esc(s.label) + '</th>' + d.allAccounts.map(function (a) {
          var v = s.values[a];
          return '<td>' + (/week of/i.test(s.label) ? fmtDate(v) : socFmt(/gained/i.test(s.label) ? 'Gained' : s.label, v)) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';

    if (d.rows.length) {
      h += '<h2>Followers</h2><div id="socFollowers"></div><h2>7-day views</h2><div id="socViews"></div>';
    }

    // Weekly log
    var cols = d.columns;
    var groups = [], prev = null;
    cols.forEach(function (c) {
      var g = c.group || '';
      if (prev && prev.name === g) prev.span++; else { prev = { name: g, span: 1 }; groups.push(prev); }
    });
    h += '<h2>Weekly log</h2>';
    h += d.rows.length ? '<div class="scroll-x"><table class="log"><thead><tr>' + groups.map(function (g) { return '<th colspan="' + g.span + '" class="grp">' + esc(g.name) + '</th>'; }).join('') + '</tr><tr>' +
      cols.map(function (c) { return '<th>' + esc(c.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      d.rows.slice().reverse().map(function (r) {
        return '<tr>' + cols.map(function (c, i) { return '<td>' + (i === 0 ? fmtDate(r[c.key]) : socFmt(c.name, r[c.key])) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' : '<div class="list"><div class="empty">No weeks logged yet.</div></div>';

    H.view.innerHTML = h;

    if (d.rows.length) {
      var labels = d.rows.map(function (r) { return fmtDate(r[d.weekKey]).replace(/\/\d{4}$/, ''); });
      var series = function (metric) {
        return d.accounts.map(function (a, i) {
          return { name: a, color: H.SERIES[i], values: d.rows.map(function (r) { return H.num(r[a + '|' + metric]); }) };
        });
      };
      var fmt = function (v, axis) { var n = H.num(v); return axis && n >= 1000 ? (n / 1000) + 'k' : Math.round(n).toLocaleString('en-US'); };
      H.lineChart(document.getElementById('socFollowers'), { title: 'Followers by week', labels: labels, series: series('Followers'), fmt: fmt });
      H.lineChart(document.getElementById('socViews'), { title: '7-day views by week', labels: labels, series: series('7-day views'), fmt: fmt });
    }
  }

  function socRowFor(week) { return SO.d.rows.filter(function (r) { return H.ymd(r[SO.d.weekKey]) === week; })[0]; }

  function openSocialForm() {
    var d = SO.d;
    var inputs = d.columns.filter(isInput);
    var byAcct = {};
    inputs.forEach(function (c) { (byAcct[c.group] = byAcct[c.group] || []).push(c); });
    var notes = d.columns.filter(function (c) { return /^notes$/i.test(c.name); })[0];
    var h = '<form class="form" id="socialForm"><h2>Log this week</h2>' +
      '<label class="field"><span>' + esc(d.weekKey) + '</span><input type="date" name="' + esc(d.weekKey) + '" value="' + esc(d.thisMonday) + '"></label>' +
      '<div class="sub" id="socWeekNote"></div>';
    Object.keys(byAcct).forEach(function (a) {
      h += '<h3 class="acct">' + esc(a) + '</h3><div class="grid2">' + byAcct[a].map(function (c) {
        return '<label class="field"><span>' + esc(c.name) + '</span><input inputmode="numeric" name="' + esc(c.key) + '" autocomplete="off"></label>';
      }).join('') + '</div>';
    });
    if (notes) h += '<label class="field"><span>Notes</span><textarea name="' + esc(notes.key) + '"></textarea></label>';
    h += '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></form>';
    H.openSheet(h);
    fillSocialForm();
  }

  function fillSocialForm() {
    var f = document.getElementById('socialForm');
    if (!f) return;
    var week = f.elements[SO.d.weekKey].value;
    var row = socRowFor(week);
    var note = document.getElementById('socWeekNote');
    note.textContent = row ? 'This week is already logged. Saving updates that row.' : 'Saving adds a new row after the last logged week. Gained, Growth % and totals fill in by formula.';
    SO.d.columns.forEach(function (c) {
      if (c.key === SO.d.weekKey) return;
      var el = f.elements[c.key];
      if (el) el.value = row && row[c.key] !== '' && row[c.key] != null ? row[c.key] : '';
    });
  }

  document.getElementById('sheet').addEventListener('change', function (e) {
    if (e.target.form && e.target.form.id === 'socialForm' && e.target.name === SO.d.weekKey) fillSocialForm();
  });

  document.getElementById('sheet').addEventListener('submit', function (e) {
    if (e.target.id !== 'socialForm') return;
    e.preventDefault(); e.stopImmediatePropagation();
    var f = e.target, vals = {};
    var row = socRowFor(f.elements[SO.d.weekKey].value);
    Array.prototype.forEach.call(f.elements, function (el) {
      if (!el.name) return;
      var v = String(el.value).trim();
      if (v === '') return;
      // Updating a logged week: send only what changed.
      if (row && el.name !== SO.d.weekKey && String(row[el.name] == null ? '' : row[el.name]) === v.replace(/,/g, '')) return;
      vals[el.name] = v;
    });
    if (row && Object.keys(vals).length === 1) { H.closeSheet(); return H.toast('No changes to save'); }
    var btn = f.querySelector('[type=submit]'), err = f.querySelector('.form-error');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Saving';
    var rid = f.getAttribute('data-rid') || H.requestId();
    f.setAttribute('data-rid', rid);
    H.api('addSocialCheckin', vals, rid).then(function (r) {
      H.closeSheet();
      H.toast((r.updated ? 'Updated' : 'Logged') + ' week of ' + fmtDate(r.week));
      H.invalidate();
      H.views.social({ fresh: true });
    }).catch(function (m) { btn.disabled = false; btn.textContent = 'Save'; err.textContent = m; err.hidden = false; });
  }, true);

  H.handlers.social = {
    click: function (e) {
      if (e.target.closest('[data-go]')) return H.go('more');
      if (e.target.closest('[data-soc-log]')) return openSocialForm();
    }
  };

  /* ---------- Scorecard history ---------- */
  H.views.history = function (opts) {
    H.view.innerHTML = '<h1>Scorecard history</h1><div class="skeleton" style="height:320px;margin-top:16px"></div>';
    H.setBusy(true);
    H.api('getHistory', !!opts.fresh).then(function (d) {
      if (H.state.tab === 'history') renderHistory(d);
    }).catch(function (m) { H.toast(m, true); }).then(function () { H.setBusy(false); });
  };

  function col(headers, re) { return headers.filter(function (h) { return re.test(h); })[0]; }

  function renderHistory(d) {
    var hs = d.headers, rows = d.rows.slice().sort(function (a, b) { return String(a[hs[0]]).localeCompare(String(b[hs[0]])); });
    var h = '<button class="back" data-go="more">More</button><h1>Scorecard history</h1>';
    if (!rows.length) { H.view.innerHTML = h + '<div class="list"><div class="empty">No weekly log rows yet.</div></div>'; return; }
    var labels = rows.map(function (r) { return fmtDate(r[hs[0]]).replace(/\/\d{4}$/, ''); });
    var countCols = [/^conversations/i, /^calls booked/i, /^calls held/i, /^closes/i, /^enrolled/i].map(function (re) { return col(hs, re); }).filter(Boolean);
    var mrrCol = col(hs, /^mrr$/i);
    h += '<h2>Pipeline and enrolled</h2><div id="histCounts"></div>';
    if (mrrCol) h += '<h2>MRR</h2><div id="histMrr"></div>';
    h += '<h2>Weekly log</h2><div class="scroll-x"><table class="log"><thead><tr>' + hs.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.slice().reverse().map(function (r) {
        return '<tr>' + hs.map(function (x, i) {
          var v = r[x];
          if (i === 0) v = fmtDate(v);
          else if (x === mrrCol) v = H.money(v);
          else v = esc(v);
          return '<td>' + v + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    H.view.innerHTML = h;
    H.lineChart(document.getElementById('histCounts'), {
      title: 'Weekly pipeline and enrolled athletes', labels: labels,
      series: countCols.map(function (c, i) { return { name: c, color: H.SERIES[i], values: rows.map(function (r) { return H.num(r[c]); }) }; }),
      fmt: function (v) { return String(Math.round(H.num(v) * 10) / 10); }, left: 32
    });
    if (mrrCol) H.lineChart(document.getElementById('histMrr'), {
      title: 'MRR by week', labels: labels, height: 180,
      series: [{ name: 'MRR', color: H.SERIES[0], values: rows.map(function (r) { return H.num(r[mrrCol]); }) }],
      fmt: function (v, axis) { var n = H.num(v); return axis && n >= 1000 ? '$' + (n / 1000) + 'k' : H.money(n); }
    });
  }

  H.handlers.history = { click: function (e) { if (e.target.closest('[data-go]')) H.go('more'); } };
})(window.Hub);
</script>

<script>
/*
 * Mac app layer: connects the bridge to Google Sheets, then sets up the app window,
 * icon, menu bar, keyboard shortcuts and Dock badge when running as an installed app.
 * Outside the installed app it offers an "Install as Mac app" button.
 */
(function () {
  'use strict';
  var H = window.Hub;
  var claude = window.claude;

  function noConnector(msg) {
    H.view.innerHTML = '<h1>323 Hub</h1><p class="placeholder">' + H.esc(msg) + '</p>';
  }

  if (!claude || typeof claude.use !== 'function') {
    noConnector('Open this app from the Claude desktop app. It reads your Command Center through your Google Sheets connector.');
    return;
  }

  H.view.innerHTML = '<div class="skeleton" style="height:40px;width:60%"></div><div class="cards">' +
    '<div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div>' +
    '<div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div>';

  claude.use('mcp').then(function (mcp) {
    if (!mcp) {
      noConnector('Google Sheets is not available in this window. Open the app from the Claude desktop app, with the Google Sheets connector turned on.');
      return;
    }
    window.HubBridge.attach(mcp);
    H.go('home');
    // Warm up the other tabs after Home has what it needs.
    setTimeout(function () { window.HubBridge.preload().catch(function () {}); }, 1500);
  });

  /* ---------- desktop app ---------- */

  var WINDOW = { titleBarStyle: 'hiddenInset', dragHeight: 64, width: 1280, height: 860, minWidth: 420, minHeight: 600, backgroundColor: '#000000' };

  function drawIcon() {
    var c = document.createElement('canvas');
    c.width = c.height = 256;
    var g = c.getContext('2d');
    var r = 56;
    g.fillStyle = '#000000';
    g.beginPath();
    g.moveTo(r, 0); g.arcTo(256, 0, 256, 256, r); g.arcTo(256, 256, 0, 256, r); g.arcTo(0, 256, 0, 0, r); g.arcTo(0, 0, 256, 0, r);
    g.closePath(); g.fill();
    g.fillStyle = '#0289eb';
    g.fillRect(40, 186, 176, 10);
    g.fillStyle = '#ffffff';
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.font = '120px Anton, "Bebas Neue", Impact, sans-serif';
    g.fillText('323', 128, 168);
    return c.toDataURL('image/png');
  }

  function menuTemplate() {
    var go = function (tab) { return function () { H.go(tab); }; };
    var add = function (tab) { return function () { H.openForm(tab, {}, function () { H.go(H.state.tab, { fresh: true }); }); }; };
    return [
      { label: 'Go', submenu: [
        { label: 'Home', accelerator: 'CmdOrCtrl+1', click: go('home') },
        { label: 'To-Do', accelerator: 'CmdOrCtrl+2', click: go('todo') },
        { label: 'Clients', accelerator: 'CmdOrCtrl+3', click: go('clients') },
        { label: 'Leads', accelerator: 'CmdOrCtrl+4', click: go('leads') },
        { label: 'Money', accelerator: 'CmdOrCtrl+5', click: go('money') },
        { type: 'separator' },
        { label: 'Content', click: go('content') },
        { label: 'Wins', click: go('wins') },
        { label: 'Scorecard history', click: go('history') },
        { label: 'Social', accelerator: 'CmdOrCtrl+6', click: go('social') }
      ] },
      { label: 'Add', submenu: [
        { label: 'Add task', accelerator: 'CmdOrCtrl+Shift+T', click: add('Daily To-Do') },
        { label: 'Add lead', accelerator: 'CmdOrCtrl+Shift+L', click: add('Leads') },
        { label: 'Add client', click: add('Clients') },
        { type: 'separator' },
        { label: 'Log payment', accelerator: 'CmdOrCtrl+Shift+P', click: add('Payments') },
        { label: 'Log expense', accelerator: 'CmdOrCtrl+Shift+E', click: add('Expenses') },
        { label: 'Log win', accelerator: 'CmdOrCtrl+Shift+W', click: add('Wins') }
      ] },
      { role: 'editMenu' },
      { label: 'View', submenu: [
        { label: 'Refresh from sheet', accelerator: 'CmdOrCtrl+R', click: function () { document.getElementById('refreshBtn').click(); } }
      ] }
    ];
  }

  /** Dock badge: overdue items on Home (red items plus overdue tasks). */
  var lastBadge = null;
  function badgeCount() {
    var h = H.state.home;
    if (!h) return null;
    var n = h.attention.filter(function (a) { return a.level === 'overdue'; }).length;
    return n;
  }

  claude.use('desktop').then(function (desktop) {
    if (!desktop) return;
    if (desktop.window) {
      document.documentElement.classList.add('in-app');
      desktop.window.setOptions(WINDOW).catch(function () {});
      var setIcon = function () { desktop.app.dock.setIcon(drawIcon()).catch(function () {}); };
      if (document.fonts && document.fonts.load) document.fonts.load('120px Anton').then(setIcon, setIcon); else setIcon();
      desktop.Menu.setApplicationMenu(menuTemplate()).catch(function () {});
      setInterval(function () {
        var n = badgeCount();
        if (n === null || n === lastBadge) return;
        lastBadge = n;
        desktop.app.dock.setBadge(n ? String(n) : '').catch(function () {});
      }, 5000);
      return;
    }
    if (!desktop.install) return;
    desktop.install.state().then(function (st) {
      if (st !== 'available') return;
      var b = document.createElement('button');
      b.className = 'btn small install-btn';
      b.textContent = 'Install as Mac app';
      b.onclick = function () {
        desktop.install.request().then(function (r) {
          if (r === 'installed') H.toast('Installing. Open 323 Hub from your Applications or Dock.');
          else if (r === 'cancelled') H.toast('Install cancelled.');
          else H.toast('Install is not available here. Open this artifact in the Claude desktop app.', true);
        }).catch(function () { H.toast('Install needs a click in the Claude desktop app.', true); });
      };
      var bar = document.querySelector('.topbar');
      bar.insertBefore(b, document.getElementById('refreshBtn'));
    }).catch(function () {});
  });
})();

</script>
