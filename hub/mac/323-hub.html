<title>323 Hub</title>
<meta name="theme-color" content="#000000">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": []}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
:root {
  --black: #000000;
  --white: #ffffff;
  --blue: #0289eb;
  --blue-dark: #0270c2;
  --red: #ff0707;
  --bg: #000000;
  --panel: #0d0f12;
  --panel-2: #15181d;
  --line: rgba(255, 255, 255, 0.12);
  --muted: #8a8f98;
  --text: #ffffff;
  --font-head: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
  --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(76px + var(--safe-b));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
.key { color: var(--blue); }
.hidden { display: none !important; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: rgba(0,0,0,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-head); font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
.icon-btn {
  width: var(--tap); height: var(--tap); display: grid; place-items: center;
  background: transparent; border: 0; border-radius: 50%; color: var(--white);
}
.icon-btn:active { background: var(--panel-2); }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { padding: 16px; max-width: 1100px; margin: 0 auto; }

/* Headings */
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 22px; margin: 28px 0 12px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.row-between { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between;
}
.card .label { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.card .num { font-family: var(--font-head); font-size: 34px; line-height: 1; margin-top: 8px; }
.card.accent { border-color: var(--blue); }
.card.accent .num { color: var(--blue); }

.week { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.week > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 8px; text-align: center; }
.week .num { font-family: var(--font-head); font-size: 28px; }
.week .label { color: var(--muted); font-size: 11px; line-height: 1.2; }

/* Lists */
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.group-label { padding: 10px 14px 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); background: var(--panel); }
.empty { padding: 18px 14px; color: var(--muted); }

.task {
  display: flex; gap: 12px; align-items: flex-start; width: 100%;
  padding: 14px; min-height: 56px; background: transparent; border: 0; text-align: left;
}
.task:active { background: var(--panel-2); }
.check {
  flex: 0 0 26px; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted);
  display: grid; place-items: center; margin-top: 1px;
}
.task.done .check { background: var(--blue); border-color: var(--blue); }
.task.done .check::after { content: ""; width: 7px; height: 13px; border: solid #000; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.task .txt { flex: 1; }
.task.done .txt { color: var(--muted); text-decoration: line-through; }
.task .mins { color: var(--muted); font-size: 13px; white-space: nowrap; }
.task.saving { opacity: .6; }

.item { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; }
.dot { flex: 0 0 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--blue); }
.dot.overdue { background: var(--red); }
.dot.info { background: var(--muted); }
.item .t { font-weight: 600; }
.item .d { color: var(--muted); font-size: 14px; }
.item.overdue .d { color: #ff8a8a; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); }
.tag.ddc { color: #f5c04a; border-color: #6b5520; }
.tag.gp { color: #b59cff; border-color: #4a3d7a; }

.bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--blue); }

/* Quick buttons */
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.btn {
  min-height: 52px; padding: 0 16px; border: 0; border-radius: var(--radius);
  background: var(--blue); color: #000; font-weight: 700; font-size: 15px; letter-spacing: .03em;
}
.btn:active { background: var(--blue-dark); }
.btn.ghost { background: var(--panel); color: var(--white); border: 1px solid var(--line); }
.btn[disabled] { opacity: .5; }
.quick .btn:last-child:nth-child(odd) { grid-column: span 2; }

/* Sheet (bottom drawer for forms) */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; overflow: auto;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: 8px 16px calc(20px + var(--safe-b));
}
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.form h2 { margin-top: 0; }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field input:not([type=checkbox]), .field select, .field textarea {
  width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: 8px;
  background: var(--black); border: 1px solid var(--line); color: var(--white); font-size: 16px;
}
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: transparent; }
.field.bool { display: flex; align-items: center; gap: 12px; min-height: var(--tap); }
.field.bool > span { margin: 0; color: var(--white); font-size: 16px; font-weight: 500; }
.field.bool input { width: 24px; height: 24px; accent-color: var(--blue); }
.more-toggle { background: none; border: 0; color: var(--blue); padding: 12px 0; font-weight: 600; }
.form-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; }
.form-error { color: #ff8a8a; margin-top: 10px; }

/* Bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(0,0,0,.96); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tabbar button {
  min-height: 60px; background: none; border: 0; color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
}
.tabbar button.on { color: var(--white); box-shadow: inset 0 2px 0 var(--blue); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + var(--safe-b)); z-index: 30;
  background: var(--white); color: var(--black); padding: 12px 18px; border-radius: 999px; font-weight: 600;
  max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.5);
}
.toast.err { background: var(--red); color: var(--white); }

.skeleton { background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); }
@keyframes shimmer { to { background-position: -200% 0; } }

.placeholder { padding: 40px 0; color: var(--muted); }
.menu { display: grid; gap: 10px; }
.menu .btn { text-align: left; }


/* ---------- shared controls (Phase B-D) ---------- */
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.full { width: 100%; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.back { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 8px 0 12px; min-height: var(--tap); }
.back::before { content: "\2039  "; font-size: 20px; }
.search, .filters select, select[data-pf] {
  width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line); color: var(--white); font-size: 16px;
}
.search { margin: 14px 0 10px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.filters select:first-child:nth-last-child(odd) { grid-column: span 2; }
select[data-pf] { width: auto; }
.seg { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-top: 14px; overflow-x: auto; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; padding: 0 10px; }
.seg button.on { background: var(--panel-2); color: var(--white); box-shadow: inset 0 -2px 0 var(--blue); }
.count { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--white); font-size: 12px; font-weight: 700; text-align: center; }
.count.red-bg { background: var(--red); }
.red-text { color: #ff6b6b; font-weight: 600; }
.chips { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--white); font-weight: 600; font-size: 14px; }
.chip.on { background: var(--blue); color: #000; border-color: var(--blue); }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: rgba(2,137,235,.16); color: #5cb8ff; }
.badge.due { background: rgba(255,255,255,.1); color: var(--white); }
.badge.over { background: var(--red); color: var(--white); }
.badge.neutral { background: var(--panel-2); color: var(--muted); }
.notice { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--blue); background: rgba(2,137,235,.08); }
.notice.red-text { border-color: var(--red); background: rgba(255,7,7,.08); }
.item.link { cursor: pointer; }
.item.link:active { background: var(--panel-2); }
.empty.small { padding: 10px 12px; font-size: 14px; }
.copybox { width: 100%; min-height: 80px; background: var(--black); color: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

/* To-Do rows */
.task-row { display: flex; align-items: stretch; width: 100%; }
.task-check { flex: 0 0 56px; display: grid; place-items: center; background: none; border: 0; min-height: 56px; }
.task-body { flex: 1; display: flex; gap: 10px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 14px 14px 14px 0; }
.task-body:active, .task-check:active { background: var(--panel-2); }
.task-row.done .check { background: var(--blue); border-color: var(--blue); }
.task-row.done .check::after { content: ""; width: 7px; height: 13px; border: solid #000; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.task-row.done .txt { color: var(--muted); text-decoration: line-through; }
.task-body .txt { flex: 1; }
.task-body .mins { color: var(--muted); font-size: 13px; }
.task-row.onb { gap: 12px; padding: 14px; background: none; border: 0; text-align: left; align-items: center; min-height: 56px; }
.task-row.onb[disabled] { opacity: .6; }
.task-row.onb.done .txt { text-decoration: none; color: var(--white); }
.group-label.row-between .sub { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 500; }

/* Clients */
.client-row { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 14px; }
.client-row:active { background: var(--panel-2); }
.client-row .t { font-weight: 600; }
.client-row .d { color: var(--muted); font-size: 14px; margin-top: 2px; }
.client-row .d.warn, .d.warn { color: #f5c04a; }
.actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 16px; }
.kv .kvrow { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.kv .kvrow.three { display: grid; grid-template-columns: 1.4fr 1fr 1fr; }
.kv .kvrow.three span:not(:first-child) { text-align: right; }
.notes { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; font-size: 17px; line-height: 1.6; min-height: 80px; max-height: 60vh; overflow: auto; }
.fields .frow { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 14px; }
.fields .fl { font-size: 13px; color: var(--muted); font-weight: 600; }
.fields .fv input:not([type=checkbox]), .fields .fv select { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px; background: var(--black); border: 1px solid var(--line); color: var(--white); font-size: 16px; }
.fields .fv input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--blue); }
.fields .ro { padding: 6px 0; }
.saved { font-size: 12px; color: #5cb8ff; min-height: 14px; }
.consent { margin-top: 6px; font-size: 13px; font-weight: 700; }
.consent.ok { color: #5cb8ff; }
.consent.no { color: #ff6b6b; }
.consent.warn { color: #f5c04a; }

/* Leads */
.linkrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.board { display: grid; gap: 12px; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.col-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 14px; background: none; border: 0; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; color: var(--blue); }
.col.collapsed .col-body { display: none; }
.col-body { padding: 0 8px 8px; display: grid; gap: 8px; }
.lead-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lead-card.overdue { border-color: var(--red); }
.lead-open { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; padding: 12px; }
.lead-open .t { font-weight: 600; }
.lead-open .d { color: var(--muted); font-size: 13px; }
.lead-card.overdue .na { color: #ff6b6b; }
.stage-pick { width: 100%; min-height: 40px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--muted); padding: 0 12px; font-size: 14px; }
.panel { margin-top: 16px; padding: 4px 14px 12px; background: var(--panel); border: 1px solid var(--blue); border-radius: var(--radius); }
.panel.overdue { border-color: var(--red); }
.panel .label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; }
.panel input, .panel select { width: 100%; min-height: var(--tap); padding: 10px 12px; border-radius: 8px; background: var(--black); border: 1px solid var(--line); color: var(--white); font-size: 16px; }

/* Charts */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .grid { stroke: rgba(255,255,255,.08); stroke-width: 1; }
.chart .axis { stroke: rgba(255,255,255,.3); stroke-width: 1; }
.chart .cross { stroke: rgba(255,255,255,.35); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.tip { position: absolute; top: 0; pointer-events: none; background: #fff; color: #000; border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.4); min-width: 120px; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip div span { margin-left: auto; font-weight: 700; padding-left: 10px; }
.tip i, .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tableview { margin-top: 8px; color: var(--muted); font-size: 14px; }
.tableview summary { cursor: pointer; padding: 8px 0; min-height: 40px; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; color: var(--white); }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 600; }
table.log td:last-child { white-space: normal; min-width: 220px; text-align: left; }

/* Social */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid2 .field { margin: 8px 0; }
h3.acct { font-family: var(--font-head); font-weight: 400; font-size: 18px; letter-spacing: .03em; color: var(--blue); margin: 18px 0 0; }
th.grp { color: var(--blue); text-align: left; border-bottom: 0; padding-bottom: 0; }

/* Content calendar */
.cal-head { margin: 14px 0 8px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
.cal-cell { min-height: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal-cell.empty { background: none; border: 0; }
.cal-cell.today { border-color: var(--blue); }
.cal-n { font-size: 11px; color: var(--muted); }
.cal-post { font-size: 11px; line-height: 1.2; text-align: left; background: rgba(2,137,235,.2); color: var(--white); border: 0; border-radius: 4px; padding: 3px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

@media (min-width: 760px) {
  .actions { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .filters { grid-template-columns: repeat(3, 1fr); }
  .filters select:first-child:nth-last-child(odd) { grid-column: auto; }
  .fields .frow { grid-template-columns: 200px 1fr 60px; align-items: center; }
  .board { grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); overflow-x: auto; align-items: start; padding-bottom: 8px; }
  .col.collapsed .col-body { display: grid; }
  .col-body { min-height: 80px; }
  .cal-cell { min-height: 90px; }
}

/* Desktop */
@media (min-width: 760px) {
  body { padding-bottom: 0; padding-top: 0; }
  .tabbar { position: sticky; top: 73px; bottom: auto; max-width: 1100px; margin: 0 auto; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); grid-template-columns: repeat(6, max-content); gap: 8px; padding: 0 16px; }
  .tabbar button { min-height: 48px; padding: 0 14px; font-size: 14px; }
  .tabbar button.on { box-shadow: inset 0 -2px 0 var(--blue); }
  body { display: flex; flex-direction: column; }
  .topbar { order: 0; } .tabbar { order: 1; } main { order: 2; width: 100%; }
  .cards { grid-template-columns: repeat(3, 1fr); }
  .home-cols { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; }
  .quick { grid-template-columns: repeat(5, 1fr); }
  .quick .btn:last-child:nth-child(odd) { grid-column: auto; }
  .sheet { left: 50%; right: auto; width: 560px; transform: translateX(-50%); bottom: 24px; border-radius: 16px; border: 1px solid var(--line); }
  .toast { bottom: 24px; }
}
@media (min-width: 1000px) {
  .cards { grid-template-columns: repeat(6, 1fr); }
}
/* Mac app window */
.install-btn { margin-left: auto; margin-right: 8px; }
html.in-app .topbar { padding-left: 88px; min-height: 64px; -webkit-app-region: drag; app-region: drag; }
html.in-app .topbar button, html.in-app .topbar a { -webkit-app-region: no-drag; app-region: no-drag; }
html.in-app .tabbar { top: 64px; }
</style>
<header class="topbar">

<script>
/**

 */
var CONFIG = {

  EDIT_TABS: ['Content', 'Wins', 'Payments', 'Expenses', 'Daily To-Do'],

      athlete: 'Athlete name', parent: 'Parent name', program: 'Program', plan: 'Plan', status: 'Status',
      paid: 'Paid this month', onboarding: ['Agreement signed', 'Intake form done', 'Velo Beam set up', 'First call held']
    },

  },

/**
 * Data layer: reads any tab into objects keyed by header name.
 *
 * readTab_(name) returns:
 *   { name, headers, meta, rows: [{ _row: 7, 'Athlete name': 'X', ... }] }
 * Dates come back as 'YYYY-MM-DD' strings (google.script.run cannot send Date objects).
 * Results are cached for CONFIG.CACHE_SECONDS and cleared on any write.
 */

var __ss = null;
function ss_() {
  if (!__ss) __ss = SpreadsheetApp.openById(CONFIG.SPREADSHEET_ID);
  return __ss;
}

function sheet_(name) {
  var sh = ss_().getSheetByName(name);
  if (!sh) throw new Error('Tab not found: ' + name);
  return sh;
}

function sheetTz_() {
  return ss_().getSpreadsheetTimeZone() || CONFIG.TZ;
}

/* ---------- small helpers ---------- */

function norm_(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
}

function isBlank_(v) {
  return v === '' || v === null || v === undefined || v === false;
}

function isDate_(v) {
  return Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v.getTime());
}

/** 'YYYY-MM-DD' for today in Boise. */
function todayStr_() {
  return Utilities.formatDate(new Date(), CONFIG.TZ, 'yyyy-MM-dd');
}

/** Add days to a 'YYYY-MM-DD' string. */
function addDays_(ymd, n) {
  var p = ymd.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return d.toISOString().slice(0, 10);
}

function serialize_(v, tz) {
  if (isDate_(v)) {
    var hm = Utilities.formatDate(v, tz, 'HH:mm');
    var day = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
    return hm === '00:00' ? day : day + 'T' + hm;
  }
  return v;
}

/** Turn a cell value into a 'YYYY-MM-DD' string if it looks like a date, else ''. */
function asYmd_(v) {
  if (!v) return '';
  var s = String(v);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return m[3] + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);
  return '';
}

function asNumber_(v) {
  if (typeof v === 'number') return v;
  if (v === '' || v == null) return 0;
  var n = Number(String(v).replace(/[$,\s]/g, ''));
  return isNaN(n) ? 0 : n;
}

/* ---------- cache (chunked: CacheService caps each value at 100KB) ---------- */

var CACHE_PREFIX = 'hub:v1:';
var CHUNK = 90000;

function cacheGet_(key) {
  var c = CacheService.getScriptCache();
  var head = c.get(CACHE_PREFIX + key);
  if (!head) return null;
  var n = Number(head);
  var keys = [];
  for (var i = 0; i < n; i++) keys.push(CACHE_PREFIX + key + ':' + i);
  var parts = c.getAll(keys);
  var s = '';
  for (var j = 0; j < n; j++) {
    var p = parts[keys[j]];
    if (p == null) return null;
    s += p;
  }
  try { return JSON.parse(s); } catch (e) { return null; }
}

function cachePut_(key, obj) {
  var s = JSON.stringify(obj);
  var map = {};
  var n = Math.ceil(s.length / CHUNK) || 1;
  for (var i = 0; i < n; i++) map[CACHE_PREFIX + key + ':' + i] = s.slice(i * CHUNK, (i + 1) * CHUNK);
  map[CACHE_PREFIX + key] = String(n);
  try { CacheService.getScriptCache().putAll(map, CONFIG.CACHE_SECONDS); } catch (e) { /* cache is optional */ }
}

/** Clear every cached read. Called after any write. */
function bustCache_() {
  var keys = [];
  Object.keys(CONFIG.TABS).forEach(function (k) {
    keys.push(CACHE_PREFIX + 'tab:' + CONFIG.TABS[k]);
  });
  keys.push(CACHE_PREFIX + 'scorecard', CACHE_PREFIX + 'settings');
  CacheService.getScriptCache().removeAll(keys);
}

/* ---------- table metadata ---------- */

/**
 * Reads row 1 and the first data row of a tab and works out, per header:
 *  - index: zero-based column index
 *  - computed: true if the column is filled by a formula (ARRAYFORMULA in row 1 or 2). Never written.
 *  - type: 'bool' | 'date' | 'number' | 'text'
 *  - choices: dropdown values from data validation, if any
 * The table ends at the first blank header, so summary blocks to the right are ignored.
 */
function buildMeta_(sh, values) {
  var header = values[0] || [];
  var width = 0;
  while (width < header.length && String(header[width]).trim() !== '') width++;
  var headers = header.slice(0, width).map(function (h) { return String(h).trim(); });

  var maxRows = sh.getMaxRows();
  var probeRows = Math.min(2, maxRows);
  var formulas = width ? sh.getRange(1, 1, probeRows, width).getFormulas() : [[]];
  var validations = (width && maxRows >= 2) ? sh.getRange(2, 1, 1, width).getDataValidations()[0] : [];

  var cols = {};
  headers.forEach(function (h, i) {
    var f1 = (formulas[0] && formulas[0][i]) || '';
    var f2 = (formulas[1] && formulas[1][i]) || '';
    var computed = !!f1 || /arrayformula/i.test(f2);
    var col = { index: i, computed: computed, type: 'text', choices: null, choiceSource: null };

    var dv = validations[i];
    if (dv) {
      var t = dv.getCriteriaType();
      var C = SpreadsheetApp.DataValidationCriteria;
      var args = dv.getCriteriaValues() || [];
      if (t === C.CHECKBOX) col.type = 'bool';
      else if (t === C.DATE_IS_VALID_DATE) col.type = 'date';
      else if (t === C.VALUE_IN_LIST) { col.choices = (args[0] || []).map(String); col.choiceSource = 'list'; }
      else if (t === C.VALUE_IN_RANGE && args[0]) {
        try {
          var seen = {};
          col.choices = args[0].getValues().map(function (r) { return String(r[0]).trim(); })
            .filter(function (v) { if (!v || seen[v]) return false; seen[v] = 1; return true; });
          col.choiceSource = 'range';
        } catch (e) { /* ignore */ }
      }
    }

    if (col.type === 'text' && !col.choices) col.type = inferType_(h, values, i);
    cols[h] = col;
  });

  return { headers: headers, width: width, cols: cols };
}

function inferType_(header, values, i) {
  var dates = 0, nums = 0, bools = 0, seen = 0;
  for (var r = 1; r < values.length && seen < 40; r++) {
    var v = values[r][i];
    if (v === '' || v == null) continue;
    seen++;
    if (isDate_(v)) dates++;
    else if (typeof v === 'number') nums++;
    else if (typeof v === 'boolean') bools++;
  }
  if (seen) {
    if (bools === seen) return 'bool';
    if (dates / seen > 0.6) return 'date';
    if (nums / seen > 0.6) return 'number';
  }
  if (/(^|\b)(date|due|ends|touch|booked on|received|week of)(\b|$)/i.test(header)) return 'date';
  if (/amount|minutes|rate|reach|saves|dms started|\(months\)/i.test(header)) return 'number';
  return 'text';
}

/* ---------- reading tabs ---------- */

function rowHasKey_(name, headers, row) {
  var keys = CONFIG.KEY_HEADERS[name];
  if (keys) {
    return keys.some(function (k) {
      var i = headers.indexOf(k);
      return i >= 0 && !isBlank_(row[i]) && String(row[i]).trim() !== '';
    });
  }
  return row.some(function (v) { return !isBlank_(v) && String(v).trim() !== ''; });
}

/**
 * Read a tab. Uses the 60 second cache unless fresh is true.
 * Rows without a value in any KEY_HEADERS column are skipped.
 */
function readTab_(name, fresh) {
  if (!fresh) {
    var hit = cacheGet_('tab:' + name);
    if (hit) return hit;
  }
  var sh = sheet_(name);
  var lastRow = sh.getLastRow();
  var lastCol = sh.getLastColumn();
  var values = lastRow && lastCol ? sh.getRange(1, 1, lastRow, lastCol).getValues() : [[]];
  var meta = buildMeta_(sh, values);
  var tz = sheetTz_();
  var rows = [];
  var errors = [];
  for (var r = 1; r < values.length; r++) {
    var raw = values[r].slice(0, meta.width);
    if (!rowHasKey_(name, meta.headers, raw)) continue;
    var obj = { _row: r + 1 };
    meta.headers.forEach(function (h, i) {
      var v = serialize_(raw[i], tz);
      if (typeof v === 'string' && /^#(REF!|N\/A|VALUE!|DIV\/0!|NAME\?|ERROR!|NUM!)/.test(v)) {
        errors.push({ tab: name, row: r + 1, header: h, error: v });
      }
      obj[h] = v;
    });
    rows.push(obj);
  }
  var out = { name: name, headers: meta.headers, meta: meta, rows: rows, errors: errors };
  cachePut_('tab:' + name, out);
  return out;
}

/* ---------- summary-layout tabs (found by label text, not cell address) ---------- */

function findCell_(grid, label, opts) {
  opts = opts || {};
  var target = norm_(label);
  var maxRow = opts.maxRow == null ? grid.length : opts.maxRow;
  for (var r = 0; r < maxRow; r++) {
    for (var c = 0; c < grid[r].length; c++) {
      var n = norm_(grid[r][c]);
      if (!n) continue;
      if (opts.exact ? n === target : n.indexOf(target) === 0) return { r: r, c: c };
    }
  }
  return null;
}

/**
 * Scorecard: each label's value sits in the cell to its right.
 * The cash-by-month table and the weekly log are found by their header text.
 */
function readScorecard_(fresh) {
  if (!fresh) {
    var hit = cacheGet_('scorecard');
    if (hit) return hit;
  }
  var sh = sheet_(CONFIG.TABS.SCORECARD);
  var tz = sheetTz_();
  var grid = sh.getDataRange().getValues().map(function (row) {
    return row.map(function (v) { return serialize_(v, tz); });
  });

  var logHead = findCell_(grid, 'Week of', { exact: true });
  var limit = logHead ? logHead.r : grid.length;

  function val(label, exact) {
    var at = findCell_(grid, label, { maxRow: limit, exact: exact });
    return at ? grid[at.r][at.c + 1] : null;
  }

  var stages = {};
  ['New', 'Talking', 'Call booked', 'Call held', 'Recap sent', 'Won', 'Lost', 'Nurture'].forEach(function (s) {
    stages[s] = val(s, true);
  });

  var out = {
    weekOf: val('Week starting'),
    conversations: val('Conversations started'),
    callsBooked: val('Calls booked', true),
    callsHeld: val('Calls held', true),
    closes: val('Closes', true),
    enrolled: val('Enrolled athletes'),
    mrr: val('Monthly recurring revenue'),
    mrrTarget: val('MRR target'),
    gap: val('Gap to target'),
    spots: val('Spots to next price step'),
    recurringCosts: val('Recurring costs per month'),
    net: val('Net per month'),
    ddcMonthly: val('DDC group'),
    paid323: val('Paid 323 athletes'),
    cashMonth: val('Cash collected this month'),
    cashYtd: val('Cash collected year to date'),
    overdueFollowups: val('Overdue follow-ups'),
    stages: stages,
    cashByMonth: readBlockTable_(grid, findCell_(grid, 'Cash collected', { exact: true, maxRow: limit })),
    weeklyLog: readBlockTable_(grid, logHead)
  };
  cachePut_('scorecard', out);
  return out;
}

/** Read a small table whose top-left header cell is at `at`. Stops at the first row with a blank first cell. */
function readBlockTable_(grid, at) {
  if (!at) return { headers: [], rows: [] };
  var head = grid[at.r];
  var headers = [];
  for (var c = at.c; c < head.length && String(head[c]).trim() !== ''; c++) headers.push(String(head[c]).trim());
  var rows = [];
  for (var r = at.r + 1; r < grid.length; r++) {
    var first = grid[r][at.c];
    if (first === '' || first == null) break;
    var obj = {};
    headers.forEach(function (h, i) { obj[h] = grid[r][at.c + i]; });
    rows.push(obj);
  }
  return { headers: headers, rows: rows };
}

/**
 * Settings: the program price table (found by its "Program" header) plus label/value pairs.
 */
function readSettings_(fresh) {
  if (!fresh) {
    var hit = cacheGet_('settings');
    if (hit) return hit;
  }
  var grid = sheet_(CONFIG.TABS.SETTINGS).getDataRange().getValues();
  var head = findCell_(grid, 'Program', { exact: true });
  var programs = [];
  var headers = [];
  var tableEnd = head ? head.r : -1;
  if (head) {
    for (var c = head.c; c < grid[head.r].length && String(grid[head.r][c]).trim() !== ''; c++) headers.push(String(grid[head.r][c]).trim());
    var paysIdx = headers.map(norm_).indexOf('paysthrough');
    for (var r = head.r + 1; r < grid.length; r++) {
      var name = String(grid[r][head.c]).trim();
      var pays = paysIdx >= 0 ? String(grid[r][head.c + paysIdx]).trim() : 'x';
      if (!name || !pays) break;
      var p = {};
      headers.forEach(function (h, i) { p[h] = grid[r][head.c + i]; });
      programs.push(p);
      tableEnd = r;
    }
  }
  var pairs = {};
  for (var rr = tableEnd + 1; rr < grid.length; rr++) {
    var label = String(grid[rr][0]).trim();
    if (label) pairs[label] = grid[rr][1];
  }
  function pick(prefix) {
    var key = Object.keys(pairs).filter(function (k) { return norm_(k).indexOf(norm_(prefix)) === 0; })[0];
    return key ? pairs[key] : null;
  }
  var agreements = {};
  Object.keys(pairs).forEach(function (k) {
    var m = k.match(/^Agreement:\s*(.+)$/i);
    if (m) agreements[m[1].trim()] = pairs[k];
  });
  var out = {
    programs: programs,
    programHeaders: headers,
    firstStep: pick('First price step'),
    secondStep: pick('Second price step'),
    increasePerStep: pick('Increase per step'),
    mrrTarget: pick('MRR target'),
    discoveryLink: pick('Discovery call link'),
    businessEmail: pick('Business email'),
    agreements: agreements,
    raw: pairs
  };
  cachePut_('settings', out);
  return out;
}

/** Tag a program so DDC and Guinea Pig never read as 323 revenue. */
function programTag_(program) {
  var p = norm_(program);
  if (!p) return '';
  if (p.indexOf('ddc') >= 0 || p.indexOf('diamonddevelopment') >= 0) return 'DDC';
  if (p.indexOf('guineapig') >= 0) return 'Guinea Pig';
  return '323';
}


/**
 * Safe write helpers. Every write:
 *  - runs inside a script lock (two quick taps cannot double-write)
 *  - maps columns by header name, read live from row 1
 *  - skips formula cells and formula-filled (ARRAYFORMULA) columns
 *  - clears the read cache afterwards
 */

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(15000)) throw new Error('The sheet is busy. Try again in a moment.');
  try {
    return fn();
  } finally {
    lock.releaseLock();
  }
}

/**
 * Run fn once per requestId. A repeat of the same request (double tap, retry) returns the first result.
 */
function once_(requestId, fn) {
  if (!requestId) return fn();
  var c = CacheService.getScriptCache();
  var key = CACHE_PREFIX + 'req:' + String(requestId).slice(0, 64);
  var prev = c.get(key);
  if (prev) return JSON.parse(prev);
  var res = fn();
  try { c.put(key, JSON.stringify(res), 600); } catch (e) { /* ignore */ }
  return res;
}

/** Live header map for writes (never cached, so a column added a second ago is respected). */
function liveMeta_(name) {
  var sh = sheet_(name);
  var lastCol = Math.max(1, sh.getLastColumn());
  var probe = Math.min(Math.max(2, sh.getLastRow()), 60);
  var values = sh.getRange(1, 1, probe, lastCol).getValues();
  return { sh: sh, meta: buildMeta_(sh, values) };
}

/** Convert an app value to what the sheet should hold for that column type. */
function coerce_(col, v) {
  if (v === null || v === undefined) return '';
  if (col.type === 'bool') return v === true || v === 'true' || v === 'TRUE';
  if (col.type === 'date') {
    var ymd = asYmd_(v);
    if (!ymd) return '';
    return Utilities.parseDate(ymd, sheetTz_(), 'yyyy-MM-dd');
  }
  if (col.type === 'number') {
    if (v === '') return '';
    var n = Number(String(v).replace(/[$,\s]/g, ''));
    return isNaN(n) ? String(v) : n;
  }
  var s = String(v);
  // A leading = + - @ would turn typed text into a formula. Store it as text.
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return s;
}

function writeCells_(sh, meta, row, changes) {
  var written = [], skipped = [];
  var rowFormulas = sh.getRange(row, 1, 1, meta.width).getFormulas()[0];
  Object.keys(changes).forEach(function (h) {
    var col = meta.cols[h];
    if (!col) { skipped.push({ header: h, reason: 'no such column' }); return; }
    if (col.computed || rowFormulas[col.index]) { skipped.push({ header: h, reason: 'formula' }); return; }
    sh.getRange(row, col.index + 1).setValue(coerce_(col, changes[h]));
    written.push(h);
  });
  return { written: written, skipped: skipped };
}

/**
 * Update cells in one row.
 * expect: { header: value } that must still match before writing, so a sorted or edited sheet
 * never gets a value written into the wrong row.
 */
function updateRow_(name, row, changes, expect) {
  return withLock_(function () {
    var lm = liveMeta_(name);
    var sh = lm.sh, meta = lm.meta;
    row = Number(row);
    if (!(row >= 2) || row > sh.getLastRow()) throw new Error('That row no longer exists. Refresh and try again.');
    if (expect) {
      var current = sh.getRange(row, 1, 1, meta.width).getValues()[0];
      Object.keys(expect).forEach(function (h) {
        var col = meta.cols[h];
        if (!col) return;
        if (String(serialize_(current[col.index], sheetTz_())).trim() !== String(expect[h]).trim()) {
          throw new Error('That row changed in the sheet. Refresh and try again.');
        }
      });
    }
    var res = writeCells_(sh, meta, row, changes);
    SpreadsheetApp.flush();
    bustCache_();
    res.row = row;
    return res;
  });
}

/**
 * Append a record after the last row that has real content.
 * Checkbox-only rows (FALSE) and formula output do not count as content, so a tab pre-filled with
 * empty checkboxes gets its next row filled instead of row 1001.
 */
function appendRow_(name, record) {
  return withLock_(function () {
    var lm = liveMeta_(name);
    var sh = lm.sh, meta = lm.meta;
    var target = firstFreeRow_(sh, meta);
    if (target > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 1);
    var res = writeCells_(sh, meta, target, record);
    SpreadsheetApp.flush();
    bustCache_();
    res.row = target;
    return res;
  });
}

function firstFreeRow_(sh, meta) {
  var last = sh.getLastRow();
  if (last < 2) return 2;
  var values = sh.getRange(2, 1, last - 1, meta.width).getValues();
  var writable = meta.headers.filter(function (h) { return !meta.cols[h].computed; })
    .map(function (h) { return meta.cols[h].index; });
  for (var r = values.length - 1; r >= 0; r--) {
    var has = writable.some(function (i) {
      var v = values[r][i];
      return v !== '' && v !== null && v !== false;
    });
    if (has) return r + 3;
  }
  return 2;
}

/**
 * Add a timestamped note to the top of a notes cell. Reads the cell inside the lock,
 * so a note typed in the sheet a second ago is kept.
 */
function prependNote_(name, row, header, text, expect) {
  if (!String(text || '').trim()) throw new Error('Type a note first.');
  return withLock_(function () {
    var lm = liveMeta_(name);
    var sh = lm.sh, meta = lm.meta;
    var col = meta.cols[header];
    if (!col) throw new Error('No ' + header + ' column on ' + name + '.');
    row = Number(row);
    if (!(row >= 2) || row > sh.getLastRow()) throw new Error('That row no longer exists. Refresh and try again.');
    var current = sh.getRange(row, 1, 1, meta.width).getValues()[0];
    Object.keys(expect || {}).forEach(function (h) {
      var c = meta.cols[h];
      if (c && String(current[c.index]).trim() !== String(expect[h]).trim()) {
        throw new Error('That row changed in the sheet. Refresh and try again.');
      }
    });
    var changes = {};
    changes[header] = stampNote_(current[col.index], text);
    var res = writeCells_(sh, meta, row, changes);
    if (res.written.indexOf(header) < 0) throw new Error('Notes could not be saved (that cell holds a formula).');
    SpreadsheetApp.flush();
    bustCache_();
    return changes[header];
  });
}

/** Prepend a timestamped line to a notes value: "M/D/YYYY: text", newest first. */
function stampNote_(existing, text) {
  var d = Utilities.formatDate(new Date(), CONFIG.TZ, 'M/d/yyyy');
  var line = d + ': ' + String(text).trim();
  existing = String(existing || '').trim();
  return existing ? line + '\n' + existing : line;
}


/**
 * Functions the front end calls with google.script.run.
 * Names without a trailing underscore are public to the page. Each one checks the owner first.
 * Error messages never include sheet values, so nothing personal ends up in logs.
 */

/* ---------- Home ---------- */

/** fresh = true skips the 60 second cache (the refresh button). */
function getHome(fresh) {
  assertOwner_();
  var T = CONFIG.TABS;
  fresh = fresh === true;
  var today = todayStr_();
  var sc = readScorecard_(fresh);
  var todo = readTab_(T.TODO, fresh);
  var leads = readTab_(T.LEADS, fresh);
  var clients = readTab_(T.CLIENTS, fresh);
  var payments = readTab_(T.PAYMENTS, fresh);

  var H = CONFIG.H;
  var todos = todo.rows.filter(function (r) { return asYmd_(r[H.todo.date]) === today; })
    .map(todoView_);

  var minutesPlanned = 0, minutesLeft = 0;
  todos.forEach(function (t) {
    minutesPlanned += t.minutes;
    if (!t.done) minutesLeft += t.minutes;
  });

  return {
    today: today,
    weekOf: sc.weekOf,
    cards: {
      mrr: sc.mrr, mrrTarget: sc.mrrTarget, gap: sc.gap, enrolled: sc.enrolled,
      paid323: sc.paid323, cashMonth: sc.cashMonth, spots: sc.spots
    },
    week: { conversations: sc.conversations, callsBooked: sc.callsBooked, callsHeld: sc.callsHeld, closes: sc.closes },
    todos: todos,
    minutesPlanned: minutesPlanned,
    minutesLeft: minutesLeft,
    attention: needsAttention_(today, leads, clients, payments),
    sheetErrors: [].concat(todo.errors, leads.errors, clients.errors, payments.errors)
  };
}

function todoView_(r) {
  var H = CONFIG.H.todo;
  return {
    row: r._row,
    date: asYmd_(r[H.date]),
    day: r[H.day] || '',
    block: r[H.block] || 'Other',
    task: r[H.task] || '',
    minutes: asNumber_(r[H.minutes]),
    done: r[H.done] === true
  };
}

function needsAttention_(today, leads, clients, payments) {
  var H = CONFIG.H;
  var items = [];
  var soon = addDays_(today, 7);

  leads.rows.forEach(function (l) {
    var due = asYmd_(l[H.leads.nextDue]);
    var stage = l[H.leads.stage] || '';
    if (due && due < today && CONFIG.CLOSED_LEAD_STAGES.indexOf(stage) < 0) {
      items.push({
        kind: 'lead', level: 'overdue', tab: CONFIG.TABS.LEADS, row: l._row,
        title: l[H.leads.athlete] || l[H.leads.parent] || 'Lead',
        detail: 'Follow-up was due ' + due + (l[H.leads.nextAction] ? '. ' + l[H.leads.nextAction] : ''),
        date: due
      });
    }
  });

  clients.rows.forEach(function (c) {
    var status = c[H.clients.status] || '';
    if (CONFIG.ACTIVE_CLIENT_STATUSES.indexOf(status) < 0) return;
    var name = c[H.clients.athlete];
    var tag = programTag_(c[H.clients.program]);
    var paid = String(c[H.clients.paid] == null ? '' : c[H.clients.paid]).trim();
    if (CONFIG.PAID_OK_VALUES.indexOf(paid) < 0) {
      items.push({
        kind: 'client-pay', level: 'due', tab: CONFIG.TABS.CLIENTS, row: c._row, tag: tag,
        title: name, detail: 'Paid this month: ' + paid
      });
    }
    var missing = H.clients.onboarding.filter(function (h) { return h in c && c[h] !== true; });
    if (missing.length) {
      items.push({
        kind: 'onboarding', level: 'info', tab: CONFIG.TABS.CLIENTS, row: c._row, tag: tag,
        title: name, detail: 'Onboarding left: ' + missing.join(', ')
      });
    }
  });

  payments.rows.forEach(function (p) {
    var due = asYmd_(p[H.payments.nextDue]);
    if (!due || p[H.payments.status] === 'Paid' || due > soon) return;
    items.push({
      kind: 'payment', level: due < today ? 'overdue' : 'due', tab: CONFIG.TABS.PAYMENTS, row: p._row,
      tag: programTag_(p[H.payments.program] || p[H.payments.athlete]),
      title: p[H.payments.athlete], detail: (due < today ? 'Payment past due since ' : 'Payment due ') + due, date: due
    });
  });

  var rank = { overdue: 0, due: 1, info: 2 };
  items.sort(function (a, b) { return rank[a.level] - rank[b.level] || String(a.date || '').localeCompare(String(b.date || '')); });
  return items;
}

/* ---------- To-Do ---------- */

function setTaskDone(row, task, done) {
  assertOwner_();
  var H = CONFIG.H.todo;
  var changes = {}; changes[H.done] = !!done;
  var expect = {}; expect[H.task] = task;

/* ---------- Add forms ---------- */

/** Field list for an add form, built from the live headers, so new columns show up on their own. */
function getFormSpec(tab) {
  assertOwner_();
  var cfg = CONFIG.ADD_FORMS[tab];
  if (!cfg) throw new Error('No add form for that tab.');
  var t = readTab_(tab);
  var meta = t.meta;
  var settings = tab === CONFIG.TABS.CLIENTS ? readSettings_() : null;
  var fields = meta.headers.filter(function (h) {
    return !meta.cols[h].computed && cfg.hidden.indexOf(h) < 0;
  }).map(function (h) {
    var col = meta.cols[h];
    var choices = col.choices, source = col.choiceSource;
    if (settings && h === CONFIG.H.clients.program) {
      if (!choices) choices = settings.programs.map(function (p) { return String(p.Program); });
      source = 'list';
    }
    if (settings && !choices && h === CONFIG.H.clients.plan) { choices = planNames_(settings); source = 'list'; }
    var suggestions = null;
    if (!choices && col.type === 'text') suggestions = distinctValues_(t.rows, h, 15);
    return {
      name: h,
      type: col.type,
      choices: choices,
      choiceSource: source,
      suggestions: suggestions,
      primary: cfg.primary.indexOf(h) >= 0,
      required: (CONFIG.KEY_HEADERS[tab] || []).indexOf(h) === 0,
      defaultToday: (CONFIG.TODAY_DEFAULTS[tab] || []).indexOf(h) >= 0
    };
  });
  fields.sort(function (a, b) {
    var ia = cfg.primary.indexOf(a.name), ib = cfg.primary.indexOf(b.name);
    if (ia < 0 && ib < 0) return 0;
    if (ia < 0) return 1;
    if (ib < 0) return -1;
    return ia - ib;
  });
  var out = { tab: tab, title: cfg.title, today: todayStr_(), fields: fields };
  if (settings) out.prices = priceTable_(settings);
  return out;
}

/**
 * Values already used in a column, offered as typing suggestions.
 * Only for category-like columns (values repeat), so names and contacts are never suggested.
 */
function distinctValues_(rows, h, max) {
  var count = {}, total = 0;
  rows.forEach(function (r) {
    var v = r[h];
    if (typeof v !== 'string') return;
    v = v.trim();
    if (!v || v.length > 40) return;
    count[v] = (count[v] || 0) + 1;
    total++;
  });
  var keys = Object.keys(count);
  var repeats = keys.some(function (k) { return count[k] > 1; });
  if (keys.length < 2 || !repeats || keys.length > total * 0.6) return null;
  return keys.sort().slice(0, max);
}

/**
 * Append one row to an allowed tab. requestId makes a repeated submit a no-op.
 */
function addRecord(tab, record, requestId) {
  assertOwner_();
  if (!CONFIG.ADD_FORMS[tab]) throw new Error('Adding rows to that tab is not allowed.');
  return once_(requestId, function () {
    var rec = {};
    Object.keys(record || {}).forEach(function (k) {
      var v = record[k];
      if (v !== '' && v !== null && v !== undefined) rec[k] = v;
    });
    var keys = CONFIG.KEY_HEADERS[tab] || [];
    if (keys.length && !keys.some(function (k) { return rec[k] !== undefined && String(rec[k]).trim() !== ''; })) {
      throw new Error('Fill in ' + keys.join(' or ') + ' first.');
    }
    var today = todayStr_();
    (CONFIG.TODAY_DEFAULTS[tab] || []).forEach(function (h) { if (!rec[h]) rec[h] = today; });
    var noteH = CONFIG.NOTE_HEADERS[tab];
    if (noteH && rec[noteH]) rec[noteH] = stampNote_('', rec[noteH]);
    var defs = CONFIG.NEW_ROW_DEFAULTS[tab] || {};
    Object.keys(defs).forEach(function (h) { if (!rec[h]) rec[h] = defs[h]; });
    if (tab === CONFIG.TABS.TODO) deriveTodoFields_(rec);

    var res = appendRow_(tab, rec);
    return { ok: true, row: res.row, skipped: res.skipped.map(function (s) { return s.header; }) };
  });
}

/** Fill Day (Mon, Tue...) and Week (W1, W2...) for a new task, matching how the tab already labels weeks. */
function deriveTodoFields_(rec) {
  var H = CONFIG.H.todo;
  var ymd = asYmd_(rec[H.date]);
  if (!ymd) return;
  var p = ymd.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  if (!rec[H.day]) rec[H.day] = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()];
  if (rec[H.week]) return;
  var monday = mondayOf_(ymd);
  var rows = readTab_(CONFIG.TABS.TODO).rows;
  // Reuse the label of a task in the same week; otherwise count on from the most recent labeled task.
  var ref = null;
  for (var i = 0; i < rows.length; i++) {
    var rd = asYmd_(rows[i][H.date]);
    var wk = String(rows[i][H.week] || '');
    if (!rd || !/^W\d+$/.test(wk)) continue;
    if (mondayOf_(rd) === monday) { rec[H.week] = wk; return; }
    if (!ref || rd > ref.date) ref = { date: rd, monday: mondayOf_(rd), n: Number(wk.slice(1)) };
  }
  if (ref) {
    var weeks = Math.round((Date.parse(monday) - Date.parse(ref.monday)) / (7 * 864e5));
    var n = ref.n + weeks;
    if (n >= 1) rec[H.week] = 'W' + n;
  }
}

function mondayOf_(ymd) {
  var p = ymd.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  var back = (d.getUTCDay() + 6) % 7;
  return addDays_(ymd, -back);
}

function getSheetUrl() {
  assertOwner_();
  return ss_().getUrl();
}

/** { program: { plan: monthly rate } } from Settings, used to prefill Monthly rate. */
function priceTable_(settings) {
  var plans = planNames_(settings);
  var out = {};
  settings.programs.forEach(function (p) {
    out[p.Program] = {};
    plans.forEach(function (pl) { if (typeof p[pl] === 'number') out[p.Program][pl] = p[pl]; });
  });
  return out;
}


/**

 */

/** All tasks (the page filters into Today, Tomorrow, This week, Overdue). */
function getTodos(fresh) {
  assertOwner_();
  var t = readTab_(CONFIG.TABS.TODO, fresh === true);
  var blocks = {};
  var rows = t.rows.map(todoView_).filter(function (x) { return x.date; });
  rows.forEach(function (x) { blocks[x.block] = 1; });
  var col = t.meta.cols[CONFIG.H.todo.block];
  return {
    today: todayStr_(),
    weekStart: mondayOf_(todayStr_()),
    tasks: rows,
    blocks: (col && col.choices) || Object.keys(blocks).sort()
  };

/**
 * Edit a task. changes may hold Date, Block, Task, Minutes.
 * Moving to a new date also updates Day and Week.
 */
function updateTask(row, expectTask, changes) {
  assertOwner_();
  var H = CONFIG.H.todo;
  var allowed = [H.date, H.block, H.task, H.minutes, H.done];
  var c = {};
  Object.keys(changes || {}).forEach(function (k) { if (allowed.indexOf(k) >= 0) c[k] = changes[k]; });
  if (c[H.task] !== undefined && !String(c[H.task]).trim()) throw new Error('Task cannot be blank.');
  if (c[H.date] !== undefined) {
    if (!asYmd_(c[H.date])) throw new Error('Pick a date.');
    deriveTodoFields_(c);
  }
  var expect = {}; expect[H.task] = expectTask;
  updateRow_(CONFIG.TABS.TODO, row, c, expect);
  return { ok: true };
}

/** Move several tasks to one date (used by "Move overdue to today"). items: [{ row, task }]. */
function moveTasks(items, date) {
  assertOwner_();
  if (!asYmd_(date)) throw new Error('Pick a date.');
  var moved = 0, failed = 0;
  (items || []).slice(0, 100).forEach(function (it) {
    try { updateTask(it.row, it.task, { Date: date }); moved++; } catch (e) { failed++; }
  });
  return { moved: moved, failed: failed };
}


/**
 * Clients screen and client profile.
 * Payments and Wins are matched to a client by athlete name.
 */

function sameName_(a, b) {
  return norm_(a) !== '' && norm_(a) === norm_(b);
}

function paymentsFor_(payments, athlete) {
  var P = CONFIG.H.payments;
  return payments.rows.filter(function (p) { return sameName_(p[P.athlete], athlete); })
    .map(function (p) {
      return {
        row: p._row, date: asYmd_(p[P.date]), amount: asNumber_(p[P.amount]),
        method: p['Paid through'] || '', program: p[P.program] || '', notes: p['Notes'] || '',
        nextDue: asYmd_(p[P.nextDue]), status: p[P.status] || ''
      };
    })
    .sort(function (a, b) { return b.date.localeCompare(a.date); });
}

/** Paid / Due / Overdue badge, plus No charge and Prepaid as plain labels. */
function payBadge_(client, pays) {
  var paid = String(client[CONFIG.H.clients.paid] == null ? '' : client[CONFIG.H.clients.paid]).trim();
  if (pays.some(function (p) { return /^overdue$/i.test(p.status); })) return 'Overdue';
  if (paid === 'Paid') return 'Paid';
  if (paid === 'Due') return 'Due';
  return paid;
}

function termInfo_(client, today) {
  var start = asYmd_(client['Start date']);
  var ends = asYmd_(client['Term ends']);
  var info = { start: start, ends: ends, months: client['Term (months)'] || '', monthsIn: null, daysLeft: null, endsSoon: false };
  if (start && start <= today) {
    var s = start.split('-').map(Number), t = today.split('-').map(Number);
    var m = (t[0] - s[0]) * 12 + (t[1] - s[1]) - (t[2] < s[2] ? 1 : 0);
    info.monthsIn = Math.max(0, m);
  }
  if (ends) {
    info.daysLeft = Math.round((Date.parse(ends) - Date.parse(today)) / 864e5);
    info.endsSoon = info.daysLeft >= 0 && info.daysLeft <= 30;
  }
  return info;
}

/** The Settings link column for a plan: "6 months" -> "6-month link". */
function planLink_(settings, program, plan) {
  var p = settings.programs.filter(function (x) { return sameName_(x.Program, program); })[0];
  if (!p || !plan) return '';
  var want = norm_(String(plan).replace(/s\b/gi, ''));
  var key = Object.keys(p).filter(function (h) {
    var n = norm_(h);
    return /link$/.test(n) && n.indexOf(want) === 0;
  })[0];
  return key ? String(p[key] || '') : '';
}

function getClients(fresh) {
  assertOwner_();
  fresh = fresh === true;
  var C = CONFIG.H.clients;
  var today = todayStr_();
  var clients = readTab_(CONFIG.TABS.CLIENTS, fresh);
  var payments = readTab_(CONFIG.TABS.PAYMENTS, fresh);
  var list = clients.rows.map(function (c) {
    var pays = paymentsFor_(payments, c[C.athlete]);
    var term = termInfo_(c, today);
    return {
      row: c._row, athlete: c[C.athlete], parent: c[C.parent] || '', email: c['Parent email'] || '',
      program: c[C.program] || '', plan: c[C.plan] || '', rate: c['Monthly rate'], status: c[C.status] || '',
      tag: programTag_(c[C.program]), pay: payBadge_(c, pays), endsSoon: term.endsSoon, daysLeft: term.daysLeft
    };
  });
  var statusCol = clients.meta.cols[C.status];
  return {
    today: today,
    clients: list,
    statuses: (statusCol && statusCol.choices) || [],
    programs: unique_(list.map(function (c) { return c.program; }))
  };
}

function unique_(arr) {
  var seen = {}, out = [];
  arr.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
  return out.sort();
}

function getClient(row, fresh) {
  assertOwner_();
  fresh = fresh === true;
  var C = CONFIG.H.clients;
  var today = todayStr_();
  var clients = readTab_(CONFIG.TABS.CLIENTS, fresh);
  var c = clients.rows.filter(function (r) { return r._row === Number(row); })[0];
  if (!c) throw new Error('Client not found. Refresh and try again.');
  var payments = readTab_(CONFIG.TABS.PAYMENTS, fresh);
  var wins = readTab_(CONFIG.TABS.WINS, fresh);
  var settings = readSettings_(fresh);
  var meta = clients.meta;
  var pays = paymentsFor_(payments, c[C.athlete]);
  var total = pays.reduce(function (s, p) { return s + p.amount; }, 0);

  var fields = meta.headers.map(function (h) {
    var col = meta.cols[h];
    var choices = col.choices;
    if (!choices && h === C.program) choices = settings.programs.map(function (p) { return String(p.Program); });
    if (!choices && h === C.plan) choices = planNames_(settings);
    if (choices && c[h] !== '' && c[h] != null && choices.indexOf(String(c[h])) < 0) choices = choices.concat([String(c[h])]);
    return { name: h, value: c[h], type: col.type, choices: choices, computed: col.computed };
  });

  return {
    row: c._row,
    athlete: c[C.athlete],
    today: today,
    tag: programTag_(c[C.program]),
    pay: payBadge_(c, pays),
    paidThisMonth: c[C.paid] || '',
    fields: fields,
    onboarding: C.onboarding.filter(function (h) { return h in c; }).map(function (h) {
      return { name: h, done: c[h] === true, computed: meta.cols[h].computed };
    }),
    term: termInfo_(c, today),
    payments: pays,
    totalPaid: total,
    nextDue: pays.length ? pays[0].nextDue : '',
    wins: wins.rows.filter(function (w) { return sameName_(w['Athlete'], c[C.athlete]); })
      .map(function (w) { var o = {}; wins.headers.forEach(function (h) { o[h] = w[h]; }); o._row = w._row; return o; })
      .sort(function (a, b) { return String(b['Date']).localeCompare(String(a['Date'])); }),
    notes: c[CONFIG.NOTE_HEADERS[CONFIG.TABS.CLIENTS]] || '',
    links: {
      email: c['Parent email'] || '',
      payment: planLink_(settings, c[C.program], c[C.plan]),
      agreement: agreementFor_(settings, c[C.program])
    }
  };
}

function agreementFor_(settings, program) {
  var key = Object.keys(settings.agreements).filter(function (k) { return sameName_(k, program); })[0];
  return key ? String(settings.agreements[key]) : '';

/** Plan names from the Settings price table headers (Month to month, 6 months, 12 months). */

  return (settings.programHeaders || []).filter(function (h) {

/**
 * Leads pipeline.

 */

function leadExpect_(lead) {

  e[L.athlete] = lead[L.athlete] == null ? '' : lead[L.athlete];

function getLeads(fresh) {
  assertOwner_();
  fresh = fresh === true;
  var L = CONFIG.H.leads;
  var today = todayStr_();
  var t = readTab_(CONFIG.TABS.LEADS, fresh);
  var settings = readSettings_(fresh);
  var stageCol = t.meta.cols[L.stage];
  var stages = (stageCol && stageCol.choices) || ['New', 'Talking', 'Call booked', 'Call held', 'Recap sent', 'Won', 'Lost', 'Nurture'];
  var leads = t.rows.map(function (r) {
    var o = { row: r._row };

    var due = asYmd_(r[L.nextDue]);

  return {
    today: today,

function getMoney(fresh) {

function getContent(fresh) {
  assertOwner_();
  fresh = fresh === true;
  var today = todayStr_();
  var t = readTab_(CONFIG.TABS.CONTENT, fresh);
  var posts = t.rows.map(function (r) {
    var o = { row: r._row };
    t.headers.forEach(function (h) { o[h] = r[h]; });
    o.date = asYmd_(r['Post date']);
    return o;
  });
  var pillarCol = t.meta.cols['Pillar'], statusCol = t.meta.cols['Status'];
  var pillars = (pillarCol && pillarCol.choices) || unique_(posts.map(function (p) { return p['Pillar']; }));
  var statuses = (statusCol && statusCol.choices) || unique_(posts.map(function (p) { return p['Status']; }));

  // A post counts as posted if its Status says so, or (when no status says so) its date has passed.
  var postedWord = statuses.filter(function (s) { return /posted|live|published/i.test(s); });
  function isPosted(p) {
    if (postedWord.length) return postedWord.indexOf(p['Status']) >= 0;
    return p.date && p.date <= today;
  }
  var last = {};
  posts.forEach(function (p) {
    if (!p['Pillar'] || !isPosted(p)) return;
    if (!last[p['Pillar']] || p.date > last[p['Pillar']]) last[p['Pillar']] = p.date;
  });
  var stale = pillars.map(function (pl) {
    var d = last[pl] || '';
    return { pillar: pl, last: d, days: d ? Math.round((Date.parse(today) - Date.parse(d)) / 864e5) : null };
  }).sort(function (a, b) {
    if (a.days === null) return -1;
    if (b.days === null) return 1;
    return b.days - a.days;
  });

  return { today: today, posts: posts, pillars: pillars, statuses: statuses, stale: stale, postedRule: postedWord.length ? 'status' : 'date' };
}

/**
 * Social tab: weekly Instagram check-in for both accounts.
 * Layout: a "Snapshot" block (label in column A, one column per account), then a "Weekly log"
 * with two header rows: account names over groups of columns, then the column names.
 * Column names repeat per account, so a column is known by "account|header" (e.g. "@dc.throws|Followers").
 * Gained, Growth % and the Both accounts columns are formulas and are never written.
 */

function socialLayout_(grid) {
  var snap = findCell_(grid, 'Snapshot', { exact: true });
  var log = findCell_(grid, 'Weekly log', { exact: true });
  var out = { accounts: [], snapshot: [], columns: [], headerRow: -1, rows: [] };

  if (snap) {
    var limit = log ? log.r : grid.length;
    for (var c = snap.c + 1; c < grid[snap.r].length && String(grid[snap.r][c]).trim(); c++) out.accounts.push(String(grid[snap.r][c]).trim());
    for (var r = snap.r + 1; r < limit; r++) {
      var label = String(grid[r][snap.c] || '').trim();
      if (!label) break;
      var vals = {};
      out.accounts.forEach(function (a, i) { vals[a] = grid[r][snap.c + 1 + i]; });
      out.snapshot.push({ label: label, values: vals });
    }
  }

  if (log) {
    // Find the column-name row: the first row below "Weekly log" whose first cell starts with "Week of".
    var hr = -1;
    for (var rr = log.r + 1; rr < Math.min(grid.length, log.r + 5); rr++) {
      if (/^week of/i.test(String(grid[rr][log.c] || '').trim())) { hr = rr; break; }
    }
    if (hr >= 0) {
      out.headerRow = hr;
      var group = '';
      for (var cc = log.c; cc < grid[hr].length; cc++) {
        var name = String(grid[hr][cc] || '').trim();
        if (!name) break;
        var g = hr > 0 ? String(grid[hr - 1][cc] || '').trim() : '';
        if (g) group = g;
        var isGroup = cc !== log.c && group && !/^notes$/i.test(name);
        out.columns.push({ index: cc, name: name, group: isGroup ? group : '', key: isGroup ? group + '|' + name : name });
      }
    }
  }
  return out;
}

function getSocial(fresh) {
  assertOwner_();
  var tz = sheetTz_();
  var sh = sheet_(CONFIG.TABS.SOCIAL);
  var grid = sh.getDataRange().getValues().map(function (row) { return row.map(function (v) { return serialize_(v, tz); }); });
  var L = socialLayout_(grid);
  var weekCol = L.columns[0];
  var followerCols = L.columns.filter(function (c) { return /^followers$/i.test(c.name) && c.group; });
  var rows = [];
  if (L.headerRow >= 0) {

      if (!logged) continue;

/**
 * Log one week. values: { 'Week of (Monday)': 'YYYY-MM-DD', '@acct|Followers': 218, ..., Notes: '...' }.
 * Writes into the row for that week if it exists, else the first empty row after the last logged week.
 * Formula cells (Week of after the first row, Gained, Growth %, Both accounts) are skipped.
 */
function addSocialCheckin(values, requestId) {
  assertOwner_();
  return once_(requestId, function () {
    return withLock_(function () {
      var sh = sheet_(CONFIG.TABS.SOCIAL);
      var tz = sheetTz_();
      var raw = sh.getDataRange().getValues();
      var grid = raw.map(function (row) { return row.map(function (v) { return serialize_(v, tz); }); });
      var L = socialLayout_(grid);
      if (L.headerRow < 0) throw new Error('Could not find the Weekly log on the Social tab.');
      var weekCol = L.columns[0];
      var followerCols = L.columns.filter(function (c) { return /^followers$/i.test(c.name) && c.group; });
      var week = asYmd_(values[weekCol.key]) || mondayOf_(todayStr_());

      var target = -1, lastLogged = L.headerRow;
      for (var r = L.headerRow + 1; r < grid.length; r++) {
        var logged = followerCols.some(function (c) { return typeof grid[r][c.index] === 'number'; });
        if (!logged) continue;
        lastLogged = r;
        if (asYmd_(grid[r][weekCol.index]) === week) target = r;
      }
      var existing = target >= 0;
      if (!existing) target = lastLogged + 1;
      var rowNum = target + 1;
      if (rowNum > sh.getMaxRows()) throw new Error('The Social tab is full. Add rows at the bottom of the Weekly log, then try again.');

      var formulas = sh.getRange(rowNum, 1, 1, Math.max(1, L.columns[L.columns.length - 1].index + 1)).getFormulas()[0];
      var written = [], skipped = [];
      L.columns.forEach(function (c) {
        if (!(c.key in values)) return;
        var v = values[c.key];
        if (v === '' || v === null || v === undefined) return;
        if (formulas[c.index]) { skipped.push(c.key); return; }
        var out;
        if (c === weekCol) {
          if (existing) return;
          out = Utilities.parseDate(asYmd_(v) || week, tz, 'yyyy-MM-dd');
        }
        else if (/^notes$/i.test(c.name)) out = /^[=+\-@]/.test(String(v)) ? "'" + v : String(v);
        else {
          var n = Number(String(v).replace(/[,\s%+]/g, ''));
          if (isNaN(n)) throw new Error(c.key.replace('|', ' ') + ' must be a number.');
          out = n;
        }
        sh.getRange(rowNum, c.index + 1).setValue(out);
        written.push(c.key);
      });
      if (!written.length) throw new Error(existing ? 'No changes to save.' : 'Nothing to save. Fill in at least one number.');
      SpreadsheetApp.flush();
      bustCache_();
      return { ok: true, row: rowNum, week: week, updated: existing, skipped: skipped };
    });
  });
}

    var h = '<h2 class="row-between"><span>Today</span><span class="sub" id="minsLeft">' + mins(d.minutesLeft) + ' left</span></h2>';
    if (!d.todos.length) return h + '<div class="list"><div class="empty">Nothing on the list for today.</div></div>';
    h += '<div class="sub" id="minsDone">' + mins(done) + ' of ' + mins(d.minutesPlanned) + ' done</div><div class="bar"><i id="minsBar" style="width:' + pct + '%"></i></div>';
    var groups = {}, order = [];
    d.todos.forEach(function (t) {
      if (!groups[t.block]) { groups[t.block] = []; order.push(t.block); }
      groups[t.block].push(t);
    });
    h += '<div class="list" style="margin-top:12px">';
    order.forEach(function (b) {
      h += '<div class="group-label">' + esc(b) + '</div>';
      groups[b].forEach(function (t) {
        h += '<button class="task' + (t.done ? ' done' : '') + '" data-task-row="' + t.row + '">' +
          '<span class="check"></span><span class="txt">' + esc(t.task) + '</span>' +
          (t.minutes ? '<span class="mins">' + t.minutes + 'm</span>' : '') + '</button>';
      });
    });
    return h + '</div>';
  }

  function attentionHtml(d) {
    var h = '<h2>Needs attention</h2>';
    var items = d.attention.slice();
    (d.sheetErrors || []).forEach(function (e) {
      items.push({ level: 'info', title: 'Sheet check: ' + e.tab + ' row ' + e.row, detail: e.header + ' shows ' + e.error });
    });
    if (!items.length) return h + '<div class="list"><div class="empty">All clear.</div></div>';
    return h + '<div class="list">' + items.map(function (it) {
      var open = it.tab === 'Clients' ? ' data-open-client="' + it.row + '" role="button" tabindex="0"' : '';
      return '<div class="item ' + esc(it.level) + (open ? ' link' : '') + '"' + open + '><span class="dot ' + esc(it.level) + '"></span><div>' +
        '<div class="t">' + esc(it.title) + tagHtml(it.tag) + '</div>' +
        '<div class="d">' + esc(String(it.detail || '').replace(/\d{4}-\d{2}-\d{2}/g, function (m) { return fmtDate(m); })) + '</div></div></div>';
    }).join('') + '</div>';
  }

  ['click', 'change', 'input'].forEach(function (type) {
    $view.addEventListener(type, function (e) {
      var h = handlers[state.tab];
      if (h && h[type]) h[type](e);
    });
  });

  handlers.home = { click: function (e) {
    var open = e.target.closest('[data-open-client]');
    if (open) return go('clients', { row: Number(open.getAttribute('data-open-client')) });
    var task = e.target.closest('[data-task-row]');
    if (task) return toggleTask(task);
    var add = e.target.closest('[data-add]');
    if (add) return openForm(add.getAttribute('data-add'));
    if (e.target.closest('[data-retry]')) return loadHome({ fresh: true });
    var menu = e.target.closest('[data-menu]');
    if (menu) return menuAction(menu.getAttribute('data-menu'));
  } };
  handlers.more = handlers.home;

  function toggleTask(el) {
    if (el.classList.contains('saving')) return;
    var row = Number(el.getAttribute('data-task-row'));
    var t = state.home.todos.filter(function (x) { return x.row === row; })[0];
    if (!t) return;
    var next = !t.done;
    t.done = next;
    el.classList.toggle('done', next);
    el.classList.add('saving');
    updateMinutes();
    api('setTaskDone', row, t.task, next).then(function () {
      el.classList.remove('saving');
      var keep = state.home; invalidate(); state.home = keep;
    }).catch(function (msg) {
      t.done = !next;
      el.classList.toggle('done', !next);
      el.classList.remove('saving');
      updateMinutes();
      toast(msg, true);
    });
  }

  function updateMinutes() {
    var d = state.home, left = 0;
    d.todos.forEach(function (t) { if (!t.done) left += t.minutes; });
    d.minutesLeft = left;
    var done = d.minutesPlanned - left;
    var a = document.getElementById('minsLeft'), b = document.getElementById('minsDone'), bar = document.getElementById('minsBar');
    if (a) a.textContent = mins(left) + ' left';
    if (b) b.textContent = mins(done) + ' of ' + mins(d.minutesPlanned) + ' done';
    if (bar) bar.style.width = (d.minutesPlanned ? Math.round(done / d.minutesPlanned * 100) : 0) + '%';
  }

  /* ---------- More ---------- */
  function renderMore() {
    $view.innerHTML = '<h1>More</h1><div class="menu" style="margin-top:16px">' +
      '<button class="btn ghost" data-menu="content">Content</button>' +
      '<button class="btn ghost" data-menu="wins">Wins</button>' +
      '<button class="btn ghost" data-menu="history">Scorecard history</button>' +
      '<button class="btn ghost" data-menu="social">Social</button>' +
      '<a class="btn ghost" id="sheetLink" href="#" target="_blank" rel="noopener">Open the Command Center sheet</a>' +
      '</div>';
    api('getSheetUrl').then(function (url) {
      var a = document.getElementById('sheetLink');
      if (a && isUrl(url)) a.href = url;
    }).catch(function () {});
  }
  function menuAction(what) {
    if (what === 'sheet') {
      api('getSheetUrl').then(function (url) { window.open(url, '_blank', 'noopener'); }).catch(function (m) { toast(m, true); });
    } else {
      go(what);
    }
  }

  /* ---------- Add forms (built from live headers) ---------- */
  var sheetEl = document.getElementById('sheet');
  var backdrop = document.getElementById('sheetBackdrop');
  function openSheet(html) {
    document.getElementById('sheetBody').innerHTML = html;
    sheetEl.hidden = false; backdrop.hidden = false;
  }
  function closeSheet() { sheetEl.hidden = true; backdrop.hidden = true; }
  backdrop.addEventListener('click', closeSheet);

  function openForm(tab, presets, onSaved) {
    state.formPresets = presets || {};
    state.formSaved = onSaved || null;
    var cached = state.specs[tab];
    var p = cached ? Promise.resolve(cached) : api('getFormSpec', tab);
    if (!cached) openSheet('<div class="skeleton" style="height:300px"></div>');
    p.then(function (spec) {
      state.specs[tab] = spec;
      openSheet(formHtml(spec));
      var f = sheetEl.querySelector('form');
      Object.keys(state.formPresets).forEach(function (k) {
        var el = f.elements[k];
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!state.formPresets[k]; else el.value = state.formPresets[k];
      });
      var first = sheetEl.querySelector('input:not([type=checkbox]),select,textarea');
      if (first && window.matchMedia('(min-width: 760px)').matches) first.focus();
    }).catch(function (msg) { closeSheet(); toast(msg, true); });
  }

  function isLong(name) { return /notes|^task$|^win$|evidence|teaching point/i.test(name); }

  function fieldHtml(f, today) {
    var id = 'f_' + f.name.replace(/[^a-z0-9]/gi, '_');
    var label = esc(f.name) + (f.required ? ' *' : '');
    var nameAttr = ' name="' + esc(f.name) + '" id="' + id + '"';
    if (f.type === 'bool') {
      return '<label class="field bool"><input type="checkbox"' + nameAttr + '><span>' + label + '</span></label>';
    }
    var input;
    if (f.choices && f.choiceSource === 'list') {
      input = '<select' + nameAttr + '><option value=""></option>' + f.choices.map(function (c) {
        return '<option>' + esc(c) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'date') {
      input = '<input type="date"' + nameAttr + (f.defaultToday ? ' value="' + esc(today) + '"' : '') + '>';
    } else if (f.type === 'number') {
      input = '<input type="text" inputmode="decimal"' + nameAttr + '>';
    } else if (isLong(f.name)) {
      input = '<textarea' + nameAttr + '></textarea>';
    } else {
      var list = f.choices || f.suggestions;
      input = '<input type="text" autocomplete="off"' + nameAttr + (list ? ' list="' + id + '_l"' : '') + '>' +
        (list ? '<datalist id="' + id + '_l">' + list.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>' : '');
    }
    return '<label class="field"><span>' + label + '</span>' + input + '</label>';
  }

  function formHtml(spec) {
    var prim = spec.fields.filter(function (f) { return f.primary; });
    var rest = spec.fields.filter(function (f) { return !f.primary; });
    var h = '<form class="form" data-tab="' + esc(spec.tab) + '" novalidate><h2>' + esc(spec.title) + '</h2>';
    h += prim.map(function (f) { return fieldHtml(f, spec.today); }).join('');
    if (rest.length) {
      h += '<button type="button" class="more-toggle" data-more>More fields (' + rest.length + ')</button>';
      h += '<div class="more hidden">' + rest.map(function (f) { return fieldHtml(f, spec.today); }).join('') + '</div>';
    }
    h += '<div class="form-error" hidden></div>';
    h += '<div class="form-actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button type="submit" class="btn">Save</button></div></form>';
    return h;
  }

  sheetEl.addEventListener('click', function (e) {
    if (e.target.closest('[data-cancel]')) return closeSheet();
    var more = e.target.closest('[data-more]');
    if (more) { more.nextElementSibling.classList.toggle('hidden'); more.remove(); }
  });

  // Add client: fill Monthly rate from the Settings price table once Program and Plan are picked.
  sheetEl.addEventListener('change', function (e) {
    var form = e.target.form;
    if (!form) return;
    var spec = state.specs[form.getAttribute('data-tab')];
    if (!spec || !spec.prices) return;
    var prog = form.elements['Program'], plan = form.elements['Plan'], rate = form.elements['Monthly rate'];
    if (!prog || !plan || !rate || (e.target !== prog && e.target !== plan)) return;
    var p = spec.prices[prog.value];
    if (p && p[plan.value] != null && (!rate.value || rate.getAttribute('data-auto'))) {
      rate.value = p[plan.value];
      rate.setAttribute('data-auto', '1');
    }
  });

  sheetEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var tab = form.getAttribute('data-tab');
    var spec = state.specs[tab];
    var rec = {};
    spec.fields.forEach(function (f) {
      var el = form.elements[f.name];
      if (!el) return;
      if (f.type === 'bool') { if (el.checked) rec[f.name] = true; return; }
      var v = String(el.value || '').trim();
      if (v) rec[f.name] = v;
    });
    var errEl = form.querySelector('.form-error');
    var missing = spec.fields.filter(function (f) { return f.required && !rec[f.name]; });
    if (missing.length) { errEl.textContent = 'Fill in ' + missing[0].name + '.'; errEl.hidden = false; return; }
    var btn = form.querySelector('[type=submit]');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Saving';
    var rid = form.getAttribute('data-rid') || requestId();
    form.setAttribute('data-rid', rid);
    api('addRecord', tab, rec, rid).then(function (res) {
      closeSheet();
      toast('Saved to ' + tab + ', row ' + res.row);
      invalidate();
      if (state.formSaved) state.formSaved(res);
      else if (state.tab === 'home') loadHome({ fresh: true });
    }).catch(function (msg) {
      btn.disabled = false; btn.textContent = 'Save';
      errEl.textContent = msg; errEl.hidden = false;
    });
  });

  /* ---------- clipboard and links (work inside the Apps Script frame) ---------- */
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    var done = function () { toast('Copied'); };
    var fail = function () { if (fallback()) done(); else openSheet('<h2>Copy this</h2><textarea class="copybox" readonly>' + esc(text) + '</textarea>'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }
  function isUrl(s) { return /^https?:\/\//i.test(String(s || '')); }

  window.Hub = {
    api: api, esc: esc, ymd: ymd, fmtDate: fmtDate, dayName: dayName, num: num, money: money, mins: mins,
    tagHtml: tagHtml, toast: toast, setBusy: setBusy, go: go, views: views, handlers: handlers, state: state,
    openForm: openForm, openSheet: openSheet, closeSheet: closeSheet, copyText: copyText, isUrl: isUrl,
    requestId: requestId, view: $view, invalidate: invalidate, onStale: onStale, boiseToday: boiseToday
  };
})();
</script>

<script>
/*
 * Small SVG charts: stacked bars and lines, one y-axis, hover tooltip, legend, table view.
 * Colors are validated for the dark surface (blue 323, amber DDC; five-series set for history).
 */
(function (H) {
  'use strict';
  var esc = H.esc;
  H.SERIES = ['#0289eb', '#e76624', '#00a888', '#d28e05', '#e24d8b'];

  function niceMax(v) {
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * p;
  }

  function frame(el, opts) {
    var w = Math.max(280, el.clientWidth || 320), h = opts.height || 220;
    var m = { t: 12, r: 12, b: 28, l: opts.left || 44 };
    return { w: w, h: h, m: m, iw: w - m.l - m.r, ih: h - m.t - m.b };
  }

  function legend(series) {
    if (series.length < 2) return '';
    return '<div class="legend">' + series.map(function (s) {
      return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
  }

  function table(labels, series, fmt) {
    return '<details class="tableview"><summary>Show as table</summary><div class="scroll-x"><table><thead><tr><th></th>' +
      series.map(function (s) { return '<th>' + esc(s.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      labels.map(function (l, i) {
        return '<tr><th>' + esc(l) + '</th>' + series.map(function (s) { return '<td>' + esc(fmt(s.values[i])) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></details>';
  }
